</script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0c0c10;
      color: #e0d8ec;
      font-family: 'Noto Sans SC', 'PingFang SC', sans-serif;
      min-height: 100vh;
    }

    /* ========== 悬停显示删除按钮 ========== */
    .flower-row:hover .del-btn {
      opacity: 0.6 !important;
      pointer-events: auto !important;
    }

    .flower-row:hover .del-btn:hover {
      opacity: 1 !important;
      background: #e0505030 !important;
    }

    /* ========== 枯萎状态呼吸灯 ========== */
    @keyframes pulse-red {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
        box-shadow: 0 0 6px currentColor;
      }

      50% {
        opacity: 0.5;
        transform: scale(1.4);
        box-shadow: 0 0 14px currentColor;
      }
    }

    @keyframes pulse-orange {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
        box-shadow: 0 0 4px currentColor;
      }

      50% {
        opacity: 0.9;
        transform: scale(1.1);
        box-shadow: 0 0 6px currentColor;
      }
    }

    @keyframes pulse-green {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
        box-shadow: 0 0 4px currentColor;
      }

      50% {
        opacity: 0.9;
        transform: scale(1.1);
        box-shadow: 0 0 6px currentColor;
      }
    }

    .status-dot-wilted {
      animation: pulse-red 1.5s ease-in-out infinite;
    }

    .status-dot-urgent {
      animation: pulse-orange 2s ease-in-out infinite;
    }

    .status-dot-alive {
      animation: pulse-green 3s ease-in-out infinite;
    }

    /* ========== 展开收起过渡动画 ========== */
    .collapse-enter {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-height 0.35s ease-out, opacity 0.25s ease-out;
    }

    .collapse-enter-active {
      max-height: 600px;
      opacity: 1;
    }

    .collapse-exit {
      max-height: 600px;
      opacity: 1;
      overflow: hidden;
      transition: max-height 0.3s ease-in, opacity 0.2s ease-in;
    }

    .collapse-exit-active {
      max-height: 0;
      opacity: 0;
    }

    /* ========== 弹窗背景淡入淡出 ========== */
    .modal-backdrop-enter {
      opacity: 0;
      transition: opacity 0.2s ease-out;
    }

    .modal-backdrop-enter-active {
      opacity: 1;
    }

    .modal-backdrop-exit {
      opacity: 1;
      transition: opacity 0.15s ease-in;
    }

    .modal-backdrop-exit-active {
      opacity: 0;
    }

    /* ========== 弹窗内容缩放淡入 ========== */
    .modal-content-enter {
      opacity: 0;
      transform: scale(0.92) translateY(10px);
      transition: opacity 0.25s ease-out, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .modal-content-enter-active {
      opacity: 1;
      transform: scale(1) translateY(0);
    }

    .modal-content-exit {
      opacity: 1;
      transform: scale(1) translateY(0);
      transition: opacity 0.15s ease-in, transform 0.15s ease-in;
    }

    .modal-content-exit-active {
      opacity: 0;
      transform: scale(0.96) translateY(8px);
    }

    /* ========== 深色模式滚动条 ========== */
    .dark-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    .dark-scrollbar::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 3px;
    }

    .dark-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(180, 143, 208, 0.3);
      border-radius: 3px;
    }

    .dark-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(180, 143, 208, 0.5);
    }

    /* ========== 浅色模式滚动条 ========== */
    .light-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    .light-scrollbar::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.05);
      border-radius: 3px;
    }

    .light-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(123, 79, 160, 0.3);
      border-radius: 3px;
    }

    .light-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(123, 79, 160, 0.5);
    }

    /* ========== 悬停显示删除按钮和折叠按钮 ========== */
    .flower-row:hover .del-btn,
    .account-card:hover .collapse-btn {
      opacity: 0.6 !important;
      pointer-events: auto !important;
    }

    .flower-row:hover .del-btn:hover,
    .account-card:hover .collapse-btn:hover {
      opacity: 1 !important;
      background: #e0505030 !important;
    }

    /* ========== Toast 滑入动画 ========== */
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(40px) scale(0.92); }
      to   { opacity: 1; transform: translateX(0) scale(1); }
    }

    /* 「回到刚改的账号」胶囊：每次编辑都弹一下，避免出现得悄无声息 */
    @keyframes pillIn {
      from { opacity: 0; transform: translateX(-18px) scale(0.88); }
      60%  { opacity: 1; transform: translateX(2px) scale(1.04); }
      to   { opacity: 1; transform: translateX(0) scale(1); }
    }
