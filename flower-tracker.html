<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>花园复活追踪</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;700&display=swap" rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.22.0/babel.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0c0c10;
      color: #e0d8ec;
      font-family: 'Noto Sans SC', 'PingFang SC', sans-serif;
      min-height: 100vh;
    }

    /* ========== 悬停显示删除按钮 ========== */
    .flower-row:hover .del-btn {
      opacity: 0.6 !important;
      pointer-events: auto !important;
    }

    .flower-row:hover .del-btn:hover {
      opacity: 1 !important;
      background: #e0505030 !important;
    }

    /* ========== 枯萎状态呼吸灯 ========== */
    @keyframes pulse-red {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
        box-shadow: 0 0 6px currentColor;
      }

      50% {
        opacity: 0.5;
        transform: scale(1.4);
        box-shadow: 0 0 14px currentColor;
      }
    }

    @keyframes pulse-orange {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
        box-shadow: 0 0 4px currentColor;
      }

      50% {
        opacity: 0.9;
        transform: scale(1.1);
        box-shadow: 0 0 6px currentColor;
      }
    }

    @keyframes pulse-green {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
        box-shadow: 0 0 4px currentColor;
      }

      50% {
        opacity: 0.9;
        transform: scale(1.1);
        box-shadow: 0 0 6px currentColor;
      }
    }

    .status-dot-wilted {
      animation: pulse-red 1.5s ease-in-out infinite;
    }

    .status-dot-urgent {
      animation: pulse-orange 2s ease-in-out infinite;
    }

    .status-dot-alive {
      animation: pulse-green 3s ease-in-out infinite;
    }

    /* ========== 展开收起过渡动画 ========== */
    .collapse-enter {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-height 0.35s ease-out, opacity 0.25s ease-out;
    }

    .collapse-enter-active {
      max-height: 600px;
      opacity: 1;
    }

    .collapse-exit {
      max-height: 600px;
      opacity: 1;
      overflow: hidden;
      transition: max-height 0.3s ease-in, opacity 0.2s ease-in;
    }

    .collapse-exit-active {
      max-height: 0;
      opacity: 0;
    }

    /* ========== 弹窗背景淡入淡出 ========== */
    .modal-backdrop-enter {
      opacity: 0;
      transition: opacity 0.2s ease-out;
    }

    .modal-backdrop-enter-active {
      opacity: 1;
    }

    .modal-backdrop-exit {
      opacity: 1;
      transition: opacity 0.15s ease-in;
    }

    .modal-backdrop-exit-active {
      opacity: 0;
    }

    /* ========== 弹窗内容缩放淡入 ========== */
    .modal-content-enter {
      opacity: 0;
      transform: scale(0.92) translateY(10px);
      transition: opacity 0.25s ease-out, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .modal-content-enter-active {
      opacity: 1;
      transform: scale(1) translateY(0);
    }

    .modal-content-exit {
      opacity: 1;
      transform: scale(1) translateY(0);
      transition: opacity 0.15s ease-in, transform 0.15s ease-in;
    }

    .modal-content-exit-active {
      opacity: 0;
      transform: scale(0.96) translateY(8px);
    }

    /* ========== 深色模式滚动条 ========== */
    .dark-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    .dark-scrollbar::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 3px;
    }

    .dark-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(180, 143, 208, 0.3);
      border-radius: 3px;
    }

    .dark-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(180, 143, 208, 0.5);
    }

    /* ========== 浅色模式滚动条 ========== */
    .light-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    .light-scrollbar::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.05);
      border-radius: 3px;
    }

    .light-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(123, 79, 160, 0.3);
      border-radius: 3px;
    }

    .light-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(123, 79, 160, 0.5);
    }

    /* ========== 悬停显示删除按钮和折叠按钮 ========== */
    .flower-row:hover .del-btn,
    .account-card:hover .collapse-btn {
      opacity: 0.6 !important;
      pointer-events: auto !important;
    }

    .flower-row:hover .del-btn:hover,
    .account-card:hover .collapse-btn:hover {
      opacity: 1 !important;
      background: #e0505030 !important;
    }

    /* ========== Toast 滑入动画 ========== */
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(40px) scale(0.92); }
      to   { opacity: 1; transform: translateX(0) scale(1); }
    }
  </style>

  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💮</text></svg>">
  <base target="_blank">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const STORAGE_KEY = "xhx-tracker-v1";
    const COLLECTION_KEY = "xhx-collection-v1";
    const DEFAULT_MS = 336 * 3600 * 1000;
    const EPHEMERAL_MS = 48 * 3600 * 1000;

    // ========== 本地存储键 ==========
    const THEME_KEY = "xhx-theme";
    const REMINDER_KEY = "xhx-account-reminders";
    const COLLAPSED_KEY = "xhx-collapsed-accounts";
    const SORT_KEY = "xhx-collection-sort";
    const PINNED_KEY = "xhx-pinned-account";
    const TODAY_KEY = "xhx-today-revived";
    const TODAY_IDS_KEY = "xhx-revived-today-ids";
    const SNAPSHOT_KEY = "xhx-autobackup-v2";

    // ========== 备份 / 同步常量 ==========
    const BACKUP_APP = "flower-tracker";
    const BACKUP_VERSION = 2;
    const SNAPSHOT_MAX = 3;
    const SNAPSHOT_MAX_BYTES = 500 * 1024;
    const SHARE_PREFIX = "FT2|";

    // ========== 本地存储读写 ==========
    function readJSON(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        if (raw === null) return fallback;
        const v = JSON.parse(raw);
        return v === null || v === undefined ? fallback : v;
      } catch { return fallback; }
    }

    function writeJSON(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch { }
    }

    // 花朵稳定键：账号ID + 花名，跨导入 / 重命名都保持稳定（uid 在导入后会重新生成）
    function stableFlowerKey(accountId, flowerName) {
      return `${accountId}|${flowerName}`;
    }

    // 剥离批量删除用的临时勾选标记，避免导入后整列表处于待删状态
    function stripSelected(goals) {
      const out = {};
      Object.entries(goals || {}).forEach(([name, g]) => {
        if (!g || typeof g !== "object") return;
        const { _selected, ...rest } = g;
        out[name] = rest;
      });
      return out;
    }

    // 账号合并：按 accountId 合并，花朵按 name 去重（已存在的不覆盖）
    function mergeAccountList(base, incoming) {
      const next = (base || []).map(a => ({ ...a, flowers: [...(a.flowers || [])] }));
      for (const p of incoming || []) {
        if (!p || !p.accountId) continue;
        const idx = next.findIndex(a => a.accountId === p.accountId);
        if (idx === -1) {
          next.push({
            id: p.id || uid(),
            accountId: p.accountId,
            flowers: (p.flowers || []).map(f => ({ ...f, id: f.id || uid() })),
          });
        } else {
          for (const f of p.flowers || []) {
            if (!next[idx].flowers.some(mf => mf.name === f.name)) {
              next[idx].flowers.push({ ...f, id: f.id || uid() });
            }
          }
        }
      }
      return next;
    }

    // 收集目标合并：同名取 needed / owned 的较大值（两边记的是同一批真实花，相加会翻倍）
    // 注意 _selected 只是批量删除的临时勾选标记，任何一侧都不该带进结果
    function mergeGoals(base, incoming) {
      const out = {};
      Object.entries(base || {}).forEach(([name, g]) => {
        if (!g || typeof g !== "object") return;
        const { _selected, ...rest } = g;
        out[name] = rest;
      });
      Object.entries(incoming || {}).forEach(([name, g]) => {
        if (!g || typeof g !== "object") return;
        const { _selected, ...rest } = g;
        const prev = out[name];
        if (!prev) { out[name] = rest; return; }
        out[name] = {
          ...prev,
          needed: Math.max(prev.needed || 0, g.needed || 0),
          owned: Math.max(prev.owned || 0, g.owned || 0),
        };
      });
      return out;
    }

    function mergeIdLists(base, incoming) {
      return Array.from(new Set([...(base || []), ...(incoming || [])]));
    }

    // ========== 备份信封 ==========
    function buildBackup(scope = "full") {
      const head = { _app: BACKUP_APP, _version: BACKUP_VERSION, _exportedAt: new Date().toISOString() };
      const prefs = {
        theme: localStorage.getItem(THEME_KEY) || "dark",
        collectionSort: localStorage.getItem(SORT_KEY) || "progress",
        accountReminders: readJSON(REMINDER_KEY, []),
        collapsedAccounts: readJSON(COLLAPSED_KEY, []),
        pinnedAccount: readJSON(PINNED_KEY, null),
      };
      if (scope === "accounts") {
        return { ...head, accounts: readJSON(STORAGE_KEY, []), collectionGoals: {}, prefs: {} };
      }
      if (scope === "prefs") {
        return { ...head, accounts: [], collectionGoals: {}, prefs };
      }
      return { ...head, accounts: readJSON(STORAGE_KEY, []), collectionGoals: stripSelected(readJSON(COLLECTION_KEY, {})), prefs };
    }

    // 解析备份文本：兼容旧版「裸数组」备份
    function parseBackup(text) {
      const parsed = JSON.parse(text);
      if (Array.isArray(parsed)) {
        return { _app: BACKUP_APP, _version: 1, accounts: parsed, collectionGoals: {}, prefs: {} };
      }
      if (!parsed || typeof parsed !== "object" || !Array.isArray(parsed.accounts)) return null;
      if (parsed._app && parsed._app !== BACKUP_APP) return null;
      return parsed;
    }

    function fmtBackupTime(iso) {
      if (!iso) return "未知时间";
      const d = new Date(iso);
      if (isNaN(d.getTime())) return "未知时间";
      const p = n => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    }

    // ========== 分享码（LZ-String 压缩，缺失时降级为 base64） ==========
    function encodeShare(payload) {
      const json = JSON.stringify(payload);
      if (window.LZString) {
        try { return SHARE_PREFIX + window.LZString.compressToEncodedURIComponent(json); } catch { }
      }
      try { return SHARE_PREFIX + "B64." + btoa(unescape(encodeURIComponent(json))); } catch { return ""; }
    }

    function decodeShare(code) {
      let text = String(code || "").trim().replace(/\s+/g, "");
      if (!text) return "";
      if (text.startsWith(SHARE_PREFIX)) text = text.slice(SHARE_PREFIX.length);
      if (text.startsWith("B64.")) {
        try { return decodeURIComponent(escape(atob(text.slice(4)))); } catch { return ""; }
      }
      if (window.LZString) {
        try {
          const out = window.LZString.decompressFromEncodedURIComponent(text);
          if (out) return out;
        } catch { }
      }
      try { return decodeURIComponent(escape(atob(text))); } catch { return ""; }
    }

    // ========== 自动快照（滚动保留最近 N 份「改动前」的状态） ==========
    // 返回是否真的写入了一份新快照
    function pushSnapshot(json) {
      if (!json || json.length > SNAPSHOT_MAX_BYTES) return false;
      const list = readJSON(SNAPSHOT_KEY, []);
      const arr = Array.isArray(list) ? list : [];
      if (arr[0] && arr[0].data === json) return false;
      writeJSON(SNAPSHOT_KEY, [{ at: Date.now(), data: json }, ...arr].slice(0, SNAPSHOT_MAX));
      return true;
    }

    function snapshotSummary(json) {
      try {
        const accounts = JSON.parse(json);
        const flowers = accounts.reduce((s, a) => s + (a.flowers?.length || 0), 0);
        return { accounts: accounts.length, flowers };
      } catch { return { accounts: 0, flowers: 0 }; }
    }

    // ========== 音频上下文 ==========
    // 复用一个 AudioContext，并在首次用户交互时解锁自动播放限制
    let __audioCtx = null;

    function getAudioCtx() {
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return null;
        if (!__audioCtx) __audioCtx = new Ctx();
        if (__audioCtx.state === "suspended") __audioCtx.resume().catch(() => { });
        return __audioCtx;
      } catch { return null; }
    }

    function unlockAudioOnce() {
      const unlock = () => {
        const ctx = getAudioCtx();
        if (ctx) ctx.resume().catch(() => { });
        document.removeEventListener("pointerdown", unlock);
        document.removeEventListener("keydown", unlock);
      };
      document.addEventListener("pointerdown", unlock);
      document.addEventListener("keydown", unlock);
    }

    // ========== 珍稀花常量定义 ==========
    const RARE_FLOWERS = [
      // 蔷薇系
      "白色蔷薇", "粉色蔷薇", "红色蔷薇", "黄色蔷薇",
      // 黑色系
      "黑色罗布麻", "黑色玫瑰", "黑色茑萝花", "黑色郁金香",
      // 绿色系
      "绿色梅花", "绿色桃花",
      // 紫色系
      "紫色百合", "紫色龙胆", "紫色昙花", "紫色薰衣草", "紫色胭脂花", "紫色夜来香", "紫色鸢尾",
      // 夕雾系
      "粉色夕雾", "蓝色夕雾", "白色夕雾", "紫色夕雾",
      // 其他
      "七彩彩虹菊",
    ];

    // 双色花映射：双色花名 -> 拆分的单色花名数组
    // 只包含至少一种颜色是珍稀花的双色花
    const DUAL_COLOR_MAP = {
      // 蔷薇系（两种颜色都是珍稀花）
      "粉白蔷薇": ["粉色蔷薇", "白色蔷薇"],
      "红白蔷薇": ["红色蔷薇", "白色蔷薇"],
      "黄白蔷薇": ["黄色蔷薇", "白色蔷薇"],
      "红粉蔷薇": ["红色蔷薇", "粉色蔷薇"],
      "红黄蔷薇": ["红色蔷薇", "黄色蔷薇"],
      "粉黄蔷薇": ["粉色蔷薇", "黄色蔷薇"],
      // 夕雾系（两种颜色都是珍稀花）
      "粉蓝夕雾": ["粉色夕雾", "蓝色夕雾"],
      "粉白夕雾": ["粉色夕雾", "白色夕雾"],
      "粉紫夕雾": ["粉色夕雾", "紫色夕雾"],
      "蓝白夕雾": ["蓝色夕雾", "白色夕雾"],
      "蓝紫夕雾": ["蓝色夕雾", "紫色夕雾"],
      "白紫夕雾": ["白色夕雾", "紫色夕雾"],
      // 罗布麻系（只有黑色是珍稀花）
      "紫黑罗布麻": ["紫色罗布麻", "黑色罗布麻"],
      "粉黑罗布麻": ["粉色罗布麻", "黑色罗布麻"],
      "黑紫罗布麻": ["黑色罗布麻", "紫色罗布麻"],
      "黑粉罗布麻": ["黑色罗布麻", "粉色罗布麻"],
      // 玫瑰系（只有黑色是珍稀花）
      "蓝黑玫瑰": ["蓝色玫瑰", "黑色玫瑰"],
      "红黑玫瑰": ["红色玫瑰", "黑色玫瑰"],
      "白黑玫瑰": ["白色玫瑰", "黑色玫瑰"],
      "黑蓝玫瑰": ["黑色玫瑰", "蓝色玫瑰"],
      "黑红玫瑰": ["黑色玫瑰", "红色玫瑰"],
      "黑白玫瑰": ["黑色玫瑰", "白色玫瑰"],
      // 茑萝系（只有黑色是珍稀花）
      "红黑茑萝": ["红色茑萝", "黑色茑萝"],
      "白黑茑萝": ["白色茑萝", "黑色茑萝"],
      "黑红茑萝": ["黑色茑萝", "红色茑萝"],
      "黑白茑萝": ["黑色茑萝", "白色茑萝"],
      "黑茑萝花": ["黑色茑萝花"],  // 单色，但名字有"黑"
      // 郁金香系（只有黑色是珍稀花）
      "粉黑郁金香": ["粉色郁金香", "黑色郁金香"],
      "白黑郁金香": ["白色郁金香", "黑色郁金香"],
      "黄黑郁金香": ["黄色郁金香", "黑色郁金香"],
      "黑粉郁金香": ["黑色郁金香", "粉色郁金香"],
      "黑白郁金香": ["黑色郁金香", "白色郁金香"],
      "黑黄郁金香": ["黑色郁金香", "黄色郁金香"],
      // 梅花系（只有绿色是珍稀花）
      "红绿梅花": ["红色梅花", "绿色梅花"],
      "白绿梅花": ["白色梅花", "绿色梅花"],
      "粉绿梅花": ["粉色梅花", "绿色梅花"],
      "绿红梅花": ["绿色梅花", "红色梅花"],
      "绿白梅花": ["绿色梅花", "白色梅花"],
      "绿粉梅花": ["绿色梅花", "粉色梅花"],
      // 百合系（只有紫色是珍稀花）
      "白紫百合": ["白色百合", "紫色百合"],
      "粉紫百合": ["粉色百合", "紫色百合"],
      "黄紫百合": ["黄色百合", "紫色百合"],
      "紫白百合": ["紫色百合", "白色百合"],
      "紫粉百合": ["紫色百合", "粉色百合"],
      "紫黄百合": ["紫色百合", "黄色百合"],
      // 龙胆系（只有紫色是珍稀花）
      "粉紫龙胆": ["粉色龙胆", "紫色龙胆"],
      "蓝紫龙胆": ["蓝色龙胆", "紫色龙胆"],
      "紫粉龙胆": ["紫色龙胆", "粉色龙胆"],
      "紫蓝龙胆": ["紫色龙胆", "蓝色龙胆"],
      // 昙花系（只有紫色是珍稀花）
      "白紫昙花": ["白色昙花", "紫色昙花"],
      "黄紫昙花": ["黄色昙花", "紫色昙花"],
      "紫白昙花": ["紫色昙花", "白色昙花"],
      "紫黄昙花": ["紫色昙花", "黄色昙花"],
      // 薰衣草系（只有紫色是珍稀花）
      "粉紫薰衣草": ["粉色薰衣草", "紫色薰衣草"],
      "蓝紫薰衣草": ["蓝色薰衣草", "紫色薰衣草"],
      "白紫薰衣草": ["白色薰衣草", "紫色薰衣草"],
      "紫粉薰衣草": ["紫色薰衣草", "粉色薰衣草"],
      "紫蓝薰衣草": ["紫色薰衣草", "蓝色薰衣草"],
      "紫白薰衣草": ["紫色薰衣草", "白色薰衣草"],
      // 胭脂花系（只有紫色是珍稀花）
      "红紫胭脂花": ["红色胭脂花", "紫色胭脂花"],
      "白紫胭脂花": ["白色胭脂花", "紫色胭脂花"],
      "黄紫胭脂花": ["黄色胭脂花", "紫色胭脂花"],
      "紫红胭脂花": ["紫色胭脂花", "红色胭脂花"],

    // 判断是否是双色花（支持颜色顺序不同）
    function getDualColorTargets(flowerName) {
      // 直接匹配
      if (DUAL_COLOR_MAP[flowerName]) {
        return DUAL_COLOR_MAP[flowerName];
      }
      // 尝试反转颜色顺序匹配（如"紫黑罗布麻" -> 找"黑紫罗布麻"）
      // 提取花系
      const flowerTypes = ["蔷薇", "夕雾", "罗布麻", "玫瑰", "茑萝", "郁金香", "梅花", "百合", "龙胆", "昙花", "薰衣草", "胭脂花", "夜来香", "鸢尾", "彩虹菊"];
      for (const type of flowerTypes) {
        if (flowerName.includes(type)) {
          // 尝试所有可能的键
          for (const [key, targets] of Object.entries(DUAL_COLOR_MAP)) {
            if (key.includes(type) && flowerName.includes(type)) {
              // 检查颜色是否相同（顺序可能不同）
              const keyColors = extractColorsFromName(key);
              const nameColors = extractColorsFromName(flowerName);
              if (arraysEqual(keyColors.sort(), nameColors.sort())) {
                return targets;
              }
            }
          }
        }
      }
      return null;
    }

    // 从花名中提取颜色词
    function extractColorsFromName(name) {
      const colorPatterns = [
        { keywords: ["七彩"], color: "七彩" },
        { keywords: ["黑色", "黑"], color: "黑色" },
        { keywords: ["白色", "白"], color: "白色" },
        { keywords: ["红色", "红"], color: "红色" },
        { keywords: ["黄色", "黄"], color: "黄色" },
        { keywords: ["蓝色", "蓝"], color: "蓝色" },
        { keywords: ["绿色", "绿"], color: "绿色" },
        { keywords: ["紫色", "紫"], color: "紫色" },
        { keywords: ["粉色", "粉"], color: "粉色" },
      ];
      const found = [];
      let remaining = name;
      for (const { keywords, color } of colorPatterns) {
        for (const kw of keywords) {
          if (remaining.includes(kw)) {
            found.push(color);
            remaining = remaining.replace(kw, "");
            break;
          }
        }
      }
      return found;
    }

    function arraysEqual(a, b) {
      if (a.length !== b.length) return false;
      for (let i = 0; i < a.length; i++) {
        if (a[i] !== b[i]) return false;
      }
      return true;
    }

    // 判断是否是双色花
    function isDualColorFlower(name) {
      return getDualColorTargets(name) !== null;
    }

    function getRareTargetsFromDual(dualName) {
      const targets = getDualColorTargets(dualName);

      // 只返回在珍稀花列表中的目标
      return targets.filter(t => RARE_FLOWERS.includes(t));

    // ========== 【修改】增强的 parseInput，支持 # 标记的新格式 ==========
    // forceFormat2: 由格式2输入框传入，强制按"花名+数量 小时 分钟 / 账号ID单独一行"解析，无需 # 号
    function parseInput(text, forceFormat2 = false) {
      const useNewFormat = forceFormat2 || text.includes('#');

      const lines = text.trim().split("\n").filter(l => l.trim());
      const out = [];
      let currentAccountFlowers = [];
      let currentAccountId = null;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        const parts = line.split(/\s+/);

        // ========== 新格式：输入框内有 # 号 ==========
        if (useNewFormat) {
          if (line === '#') continue;

          const isAccountLine = parts.length === 1 && /^\d+$/.test(parts[0]);

          if (isAccountLine) {
            if (currentAccountFlowers.length > 0) {
              out.push({
                id: uid(),
                accountId: parts[0],
                flowers: currentAccountFlowers,
              });
              currentAccountFlowers = [];
            }
            continue;
          }

          if (parts.length >= 3) {
            const last = parts[parts.length - 1];
            const secondLast = parts[parts.length - 2];

            if (/^\d+$/.test(last) && /^\d+$/.test(secondLast)) {
              const flowerPart = parts[parts.length - 3];
              const m = flowerPart.match(/^(\d+)?(.+?)(\d+)$/);

              if (m) {
                const prefix = m[1] ? m[1] : "";
                const name = prefix + m[2];
                const count = parseInt(m[3]);
                const remainingHours = parseInt(secondLast);
                const remainingMinutes = parseInt(last);

                const durationMs = name.includes('昙花') ? EPHEMERAL_MS : DEFAULT_MS;
                const remainingMs = (remainingHours * 3600 + remainingMinutes * 60) * 1000;
                const revivalTime = Date.now() - (durationMs - remainingMs);

                currentAccountFlowers.push({
                  id: uid(),
                  name: name,
                  count: count,
                  revivalTime: revivalTime,
                  durationMs: durationMs,
                });
                continue;
              }
            }
          }
          continue;
        }

        // ========== 旧格式（无 # 号）==========
        const lastPart = parts[parts.length - 1];
        if (/^\d+$/.test(lastPart)) {
          const flowers = [];
          for (let j = 0; j < parts.length - 1; j++) {
            const p = parts[j];
            const m = p.match(/^(.+?)(\d+)$/);
            if (m) {
              flowers.push({
                id: uid(),
                name: m[1],
                count: parseInt(m[2]),
                revivalTime: null,
                durationMs: DEFAULT_MS,
              });
            }
          }

          if (flowers.length > 0) {
            out.push({
              id: uid(),
              accountId: lastPart,
              flowers: flowers,
            });
          }
        }
      }

      if (useNewFormat && currentAccountFlowers.length > 0) {
        const lastLine = lines[lines.length - 1].trim();
        const accountId = /^\d+$/.test(lastLine) ? lastLine : 'unknown';
        out.push({
          id: uid(),
          accountId: accountId,
          flowers: currentAccountFlowers,
        });
      }

      return out;
    }

    function remMs(f) {
      if (f.revivalTime === null) return null;
      return f.revivalTime + f.durationMs - Date.now();
    }

    function fmtRem(ms) {
      if (ms === null) return "未记录";
      const abs = Math.abs(ms);
      const d = Math.floor(abs / 86400000);
      const h = Math.floor((abs % 86400000) / 3600000);
      const m = Math.floor((abs % 3600000) / 60000);
      const s = ms < 0 ? "-" : "";
      if (d > 0) return `${s}${d}天${h}h${m}m`;
      if (h > 0) return `${s}${h}h${m}m`;
      return `${s}${m}分钟`;
    }

    function fmtDate(ts) {
      if (!ts) return "—";
      return new Date(ts).toLocaleString("zh-CN", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
    }

    function toDatetimeLocal(ts) {
      if (!ts) return "";
      const d = new Date(ts - new Date().getTimezoneOffset() * 60000);
      return d.toISOString().slice(0, 16);
    }

    function status(f) {
      const r = remMs(f);
      if (r === null) return "unknown";
      if (r <= 0) return "wilted";
      if (r < 24 * 3600000) return "urgent";
      return "alive";
    }

    // ========== 辅助函数：计算复活时间和剩余时长的联动 ==========
    // 给定剩余时长(小时)，计算复活时间 = 当前时间 + 剩余时长 - 总时长
    function calcRevivalTimeFromRemaining(remainingHours, totalDurationMs) {
      const now = Date.now();
      const remainingMs = remainingHours * 3600000;
      // 复活时间 = 枯萎时间 - 总时长 = (当前时间 + 剩余时长) - 总时长
      const revivalTime = now + remainingMs - totalDurationMs;
      return revivalTime;
    }

    // 给定复活时间，计算剩余时长(小时) = (复活时间 + 总时长) - 当前时间
    function calcRemainingFromRevivalTime(revivalTimeMs, totalDurationMs) {
      const now = Date.now();
      const remainingMs = (revivalTimeMs + totalDurationMs) - now;
      return remainingMs / 3600000;
    }

          }, 150);
          return () => clearTimeout(timer);
        }
      }, [value]);

      return (
        <span style={{
          display: "inline-block",
          color,
          transform: isFlipping ? "rotateX(-90deg)" : "rotateX(0)",
          opacity: isFlipping ? 0.5 : 1,
          transition: "transform 0.15s ease-in, opacity 0.15s",
          transformOrigin: "center bottom",
          fontVariantNumeric: "tabular-nums",
        }}>
          {displayValue}
        </span>
      );
    }

      // 主数据持久化 + 自动快照（每次改动前先留一份，滚动保留最近 3 份）
      const lastAccountsJsonRef = React.useRef(null);
      useEffect(() => {
        if (!loaded) return;
        const json = JSON.stringify(accounts);
        try { localStorage.setItem(STORAGE_KEY, json); } catch { }
        const prev = lastAccountsJsonRef.current;
        if (prev !== null && prev !== json && pushSnapshot(prev)) loadSnapshots();
        lastAccountsJsonRef.current = json;
      }, [accounts, loaded]);

      // ========== 置顶账号持久化 ==========
      useEffect(() => {
        writeJSON(PINNED_KEY, pinnedAccountId);
      }, [pinnedAccountId]);

      // ========== 收集进度数据持久化 ==========
      useEffect(() => {
        try {
          localStorage.setItem(COLLECTION_KEY, JSON.stringify(collectionGoals));
        } catch { }
      }, [collectionGoals]);

      // ========== 收集进度排序持久化 ==========
      useEffect(() => {
        try {
          localStorage.setItem(SORT_KEY, collectionSort);
        } catch { }
      }, [collectionSort]);

      // ========== 收集面板过渡动画 ==========
      useEffect(() => {

        } else {

      // ========== 加载完成后清理不存在的账号的提醒记录 ==========
      useEffect(() => {
        if (!loaded || accounts.length === 0) return;
        const validIds = new Set(accounts.map(a => a.accountId));
        setAccountReminders(prev => {
          const newSet = new Set([...prev].filter(id => validIds.has(id)));
          if (newSet.size !== prev.size) {
            localStorage.setItem(REMINDER_KEY, JSON.stringify(Array.from(newSet)));
          }

      }, [loaded, accounts]);

      useEffect(() => {
        if (!loaded) return;

        // 初始化状态记录
        if (!window.__reminderState) window.__reminderState = {};

        // 清除旧的轮询
        if (window.__reminderInterval) {
          clearInterval(window.__reminderInterval);
          window.__reminderInterval = null;
        }

        // 如果没有任何账号开启提醒，不需要启动轮询
        if (accountReminders.size === 0) return;

        // 启动轮询：每 10 秒检查一次
        window.__reminderInterval = setInterval(() => {
          const now = Date.now();

          accountReminders.forEach(accountId => {
            const account = accounts.find(a => a.accountId === accountId);
            if (!account) return;

            if (!window.__reminderState[accountId]) window.__reminderState[accountId] = {};

            account.flowers.forEach(f => {
              if (f.revivalTime === null) return;

              const wiltTime = f.revivalTime + f.durationMs;
              const timeUntilWilt = wiltTime - now;
              const prevState = window.__reminderState[accountId][f.id];

              // 初始化状态（第一次看到这个花）
              if (prevState === undefined) {
                window.__reminderState[accountId][f.id] = timeUntilWilt;
                return;
              }

              // 情况1：从"活着"变成"枯萎"（刚好枯萎）
              if (prevState > 0 && timeUntilWilt <= 0) {
                const msg = `账号 #${accountId} 的 ${f.name}×${f.count} 已经枯萎了！`;
                addToast("🥀 花朵已枯萎！", msg);
                playWiltedBeep();
                flashTitle("🥀 已经枯萎了！");
              }

              // 情况2：从"还有2分钟以上"变成"不到2分钟"（即将枯萎）
              if (prevState > 2 * 60000 && timeUntilWilt > 0 && timeUntilWilt <= 2 * 60000) {
                const msg = `账号 #${accountId} 的 ${f.name}×${f.count} 还有 2 分钟就枯萎了！`;
                addToast("🥀 花朵即将枯萎！", msg);
                playBeep();
                flashTitle("🥀 快去复活！");
              }

              // 更新状态
              window.__reminderState[accountId][f.id] = timeUntilWilt;
            });
          });
        }, 10000); // 每 10 秒检查一次

        return () => {
          if (window.__reminderInterval) {
            clearInterval(window.__reminderInterval);
            window.__reminderInterval = null;
          }
        };
      }, [loaded, accounts, accountReminders]);

      useEffect(() => {

      // 展开状态不持久化，刷新后默认收起（无需写入 localStorage）

      // ========== 备份：导出 ==========
      function exportData() {
        const payload = buildBackup();
        if (!payload.accounts.length) {
          setBackupMsg({ type: "err", text: "还没有任何账号数据，先添加账号再导出。" });
          return;
        }
        const json = JSON.stringify(payload, null, 2);
        const blob = new Blob([json], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        const d = new Date();
        const p = n => String(n).padStart(2, "0");
        a.download = `花园复活追踪备份_${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}_${p(d.getHours())}-${p(d.getMinutes())}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        const goalCount = Object.keys(payload.collectionGoals).length;
        setBackupMsg({
          type: "ok",
          text: `已导出 ${payload.accounts.length} 个账号 · ${goalCount} 个收集目标 · 含提醒/折叠/排序/主题设置。`,
        });

      // ========== 备份：从文件读取（只解析，不直接落库） ==========
      function importData(file) {
        const reader = new FileReader();
        reader.onload = e => {
          let payload = null;
          try {
            payload = parseBackup(e.target.result);
          } catch {
            setBackupMsg({ type: "err", text: "无法解析该文件，请确认是本工具导出的 JSON 备份。" });
            return;
          }
          if (!payload) {
            setBackupMsg({ type: "err", text: "这不是「花园复活追踪」的备份文件。" });
            return;
          }
          if (!payload.accounts.length) {
            setBackupMsg({ type: "err", text: "备份里没有任何账号数据。" });
            return;
          }
          setPendingRestore({ backup: payload, source: "文件" });
        };
        reader.readAsText(file);
      }

      // ========== 备份：应用（覆盖 / 合并 / 只导配置） ==========
      function applyBackup(payload, mode) {
        const prefs = payload.prefs || {};
        const incoming = payload.accounts || [];
        const snapshotJson = localStorage.getItem(STORAGE_KEY);

        // 先算出最终账号集，后面的偏好设置要按它过滤，避免留下指向不存在账号的键
        let finalAccounts = accounts;
        if (mode !== "prefsOnly") {
          finalAccounts = mode === "merge"
            ? mergeAccountList(accounts, incoming)
            : incoming.map(a => ({
              id: a.id || uid(),
              accountId: a.accountId,
              flowers: (a.flowers || []).map(f => ({ ...f, id: f.id || uid() })),
            }));
          if (snapshotJson) {
            pushSnapshot(snapshotJson);
            loadSnapshots();
          }
          setAccounts(finalAccounts);
          if (payload.collectionGoals && Object.keys(payload.collectionGoals).length) {
            setCollectionGoals(prev => (mode === "merge"
              ? mergeGoals(prev, payload.collectionGoals)
              : stripSelected(payload.collectionGoals)));
          }
        }

        const validIds = new Set(finalAccounts.map(a => a.accountId));

        // 偏好设置：合并模式取并集，覆盖 / 只导配置直接以备份为准
        if (prefs.theme === "dark" || prefs.theme === "light") {
          setTheme(prefs.theme);
          localStorage.setItem(THEME_KEY, prefs.theme);
        }
        if (typeof prefs.collectionSort === "string" && prefs.collectionSort) {
          setCollectionSort(prefs.collectionSort);
        }
        setAccountReminders(prev => {
          const base = mode === "merge" ? prev : new Set();
          const next = new Set([...base, ...(prefs.accountReminders || [])].filter(id => validIds.has(id)));
          writeJSON(REMINDER_KEY, Array.from(next));
          return next;
        });
        setCollapsedAccounts(prev => {
          const base = mode === "merge" ? prev : new Set();
          return new Set([...base, ...(prefs.collapsedAccounts || [])].filter(id => validIds.has(id)));
        });
        if (prefs.pinnedAccount && validIds.has(prefs.pinnedAccount)) {
          setPinnedAccountId(prefs.pinnedAccount);
        } else if (mode !== "merge") {
          setPinnedAccountId(null);
        }

        const modeText = mode === "merge" ? "合并导入" : mode === "prefsOnly" ? "仅导入设置" : "覆盖导入";
        const source = pendingRestore ? pendingRestore.source : "备份";
        setPendingRestore(null);
        setBackupMsg({
          type: "ok",
          text: `${modeText}完成（来自${source}）：当前 ${finalAccounts.length} 个账号。`,
        });
      }

      // ========== 备份：分享码 ==========
      const SHARE_SCOPES = [
        { id: "full", label: "全量", hint: "账号 + 收集 + 设置" },
        { id: "accounts", label: "仅账号", hint: "只带账号数据，码最短" },
        { id: "prefs", label: "仅设置", hint: "主题 / 排序 / 提醒 / 折叠 / 置顶" },
      ];
      function shareScopeLabel(id) {
        return (SHARE_SCOPES.find(s => s.id === id) || SHARE_SCOPES[0]).label;
      }
      function generateShareCode() {
        const payload = buildBackup(shareScope);
        if (shareScope !== "prefs" && !payload.accounts.length) {
          setBackupMsg({ type: "err", text: "还没有账号数据可以生成分享码，可切换为「仅设置」。" });
          return;
        }
        const code = encodeShare(payload);
        if (!code) {
          setBackupMsg({ type: "err", text: "生成失败，请刷新页面后重试。" });
          return;
        }
        setShareCode(code);
        setBackupMsg({
          type: "ok",
          text: `分享码已生成（${shareScopeLabel(shareScope)} · ${code.length} 字符）${window.LZString ? "" : " · 压缩库未加载，码较长但不影响使用"}，复制到另一台设备粘贴即可。`,
        });
      }

      function importShareCode() {
        const text = sharePaste.trim();
        if (!text) {
          setBackupMsg({ type: "err", text: "请先粘贴分享码。" });
          return;
        }
        const decoded = decodeShare(text);
        if (!decoded) {
          setBackupMsg({ type: "err", text: "分享码无法识别，请确认复制完整（不要漏掉结尾）。" });
          return;
        }
        let payload = null;
        try { payload = parseBackup(decoded); } catch { payload = null; }
        const hasAccounts = payload && payload.accounts.length > 0;
        const hasPrefs = payload && (Object.keys(payload.prefs || {}).length > 0 || Object.keys(payload.collectionGoals || {}).length > 0);
        if (!payload || (!hasAccounts && !hasPrefs)) {
          setBackupMsg({ type: "err", text: "分享码内容不完整或不是本工具的分享码。" });
          return;
        }
        setPendingRestore({ backup: payload, source: "分享码" });
      }

      // ========== 备份：自动快照 ==========
      function loadSnapshots() {
        const list = readJSON(SNAPSHOT_KEY, []);
        setSnapshots(Array.isArray(list) ? list : []);
      }

      function restoreSnapshot(snap) {
        if (!snap || !snap.data) return;
        try {
          const parsed = JSON.parse(snap.data);
          if (!Array.isArray(parsed)) return;
          const current = localStorage.getItem(STORAGE_KEY);
          if (current) pushSnapshot(current);
          setAccounts(parsed);
          loadSnapshots();
          setBackupMsg({ type: "ok", text: `已恢复到 ${fmtBackupTime(new Date(snap.at).toISOString())} 的快照。` });
        } catch {
          setBackupMsg({ type: "err", text: "该快照已损坏，无法恢复。" });
        }
      }

      function clearSnapshots() {
        localStorage.removeItem(SNAPSHOT_KEY);
        setSnapshots([]);
        setBackupMsg({ type: "ok", text: "自动快照已清空。" });
      }

      // 打开备份面板时刷新一次快照列表
      useEffect(() => {
        if (showBackup) loadSnapshots();
      }, [showBackup]);

      // 备份面板里的提示 6 秒后自动消失
      useEffect(() => {
        if (!backupMsg || backupMsg.type === "err") return;
        const t = setTimeout(() => setBackupMsg(null), 6000);
        return () => clearTimeout(t);
      }, [backupMsg]);

      // ========== 日历辅助函数 ==========
      function getWiltDate(ts, durationMs) {
        const wiltTime = ts + durationMs;
        const d = new Date(wiltTime);
        d.setHours(0, 0, 0, 0);
        return d.getTime();
      }

      function getTodayStart() {
        const d = new Date();
        d.setHours(0, 0, 0, 0);
        return d.getTime();
      }

      function getDateKey(ts) {
        const d = new Date(ts);
        return `${d.getMonth() + 1}月${d.getDate()}日`;
      }

      function getDayLabel(ts, index) {
        if (index === 0) return "今天";
        if (index === 1) return "明天";
        const d = new Date(ts);
        return `${d.getMonth() + 1}/${d.getDate()}`;
      }

      function getCalendarData(searchQuery = "") {
        const data = {};
        const todayStart = getTodayStart();
        const todayEnd = todayStart + 86400000;
        const query = searchQuery.trim();

        // 判断搜索类型
        const isAccountSearch = /^\d+$/.test(query);     // 纯数字 → 按账号ID过滤
        const isCollapsedSearch = query === "//";        // // → 按折叠账号过滤
        const isFlowerSearch = query && !isAccountSearch && !isCollapsedSearch; // 其他 → 按花名过滤

        // 过滤函数：判断一朵花是否应该被统计
        const shouldIncludeFlower = (account, flower) => {
          if (!query) return true; // 无搜索，全部包含

          if (isCollapsedSearch) {
            // 只统计折叠账号的花
            return collapsedAccounts.has(account.accountId);
          }

          if (isAccountSearch) {
            // 按账号ID过滤：只包含匹配账号的所有花
            return account.accountId.includes(query);
          }

          // 按花名过滤：只包含匹配花名的花
          return flower.name.toLowerCase().includes(query.toLowerCase());
        };

        // 过滤函数：判断账号是否应该被统计（用于 revived 统计，因为 revived 没有 flower 信息）
        const shouldIncludeAccount = (account) => {
          if (!query) return true;
          if (isCollapsedSearch) return collapsedAccounts.has(account.accountId);
          if (isAccountSearch) return account.accountId.includes(query);
          return true; // 花名搜索时，账号级别的 revived 需要遍历所有账号找匹配的花
        };

        for (let i = 0; i < 14; i++) {
          data[todayStart + i * 86400000] = {
            count: 0,
            revived: 0,
            pending: 0,
            flowers: []
          };
        }

        // 先统计今天已复活的花（从 revivedTodayIds）
        accounts.forEach(a => {
          if (!shouldIncludeAccount(a)) return;
          a.flowers.forEach(f => {
            if (revivedTodayIds.has(f.id) && shouldIncludeFlower(a, f)) {
              data[todayStart].revived += f.count;
            }
          });
        });

        // 再统计今天待处理的花（当前状态是已过期或今天枯萎）
        accounts.forEach(a => {
          a.flowers.forEach(f => {
            if (!shouldIncludeFlower(a, f)) return;
            if (f.revivalTime === null) return; // 未记录不算

            const rem = remMs(f);
            if (rem === null) return;

            const wiltTime = f.revivalTime + f.durationMs;
            const isExpired = rem <= 0; // 已枯萎
            const isTodayWilt = wiltTime >= todayStart && wiltTime < todayEnd; // 今天内枯萎

            // 只统计未复活的
            if (!revivedTodayIds.has(f.id) && (isExpired || isTodayWilt)) {
              data[todayStart].pending += f.count;
              data[todayStart].flowers.push(f);
            }
          });
        });

        data[todayStart].count = data[todayStart].revived + data[todayStart].pending;

        // 明天及未来
        accounts.forEach(a => {
          a.flowers.forEach(f => {
            if (!shouldIncludeFlower(a, f)) return;
            if (f.revivalTime === null) return;
            const rem = remMs(f);
            if (rem === null) return;

            const wiltTime = f.revivalTime + f.durationMs;
            if (rem <= 0) return; // 已枯萎的已处理
            if (wiltTime >= todayStart && wiltTime < todayEnd) return; // 今天枯萎的已处理

            const wiltDate = getWiltDate(f.revivalTime, f.durationMs);
            const dayIndex = Math.floor((wiltDate - todayStart) / 86400000);

            if (dayIndex >= 1 && dayIndex < 14) {
              const key = todayStart + dayIndex * 86400000;
              if (data[key]) {
                data[key].count += f.count;
              }
            }
          });
        });

        return Object.entries(data).map(([timestamp, info]) => ({
          timestamp: parseInt(timestamp),
          ...info,
        }));
      }

      function getExpiredCount() {
        return accounts.reduce((sum, a) => {
          const accountExpired = a.flowers.reduce((flowerSum, f) => {
            if (f.revivalTime === null) return flowerSum;
            const rem = remMs(f);
            if (rem !== null && rem <= -86400000) {
              return flowerSum + f.count;
            }
            return flowerSum;
          }, 0);
          return sum + accountExpired;
        }, 0);
      }

      // ========== 收集进度相关函数 ==========

      // 计算某花近14天的枯萎总数（所有账号）
      // 单色花按100%计算，双色花按50%计算，昙花14天内会枯萎7轮所以乘7
      function getFlowerWiltCount14Days(flowerName) {
        const todayStart = getTodayStart();
        let singleColorCount = 0;   // 单色花数量
        let dualColorCount = 0;     // 双色花数量（目标包含该珍稀花的）

        accounts.forEach(a => {
          a.flowers.forEach(f => {
            if (f.revivalTime === null) return;
            const rem = remMs(f);
            if (rem === null) return;

            // 统计14天内会枯萎的（包括已枯萎的）
            const wiltDate = getWiltDate(f.revivalTime, f.durationMs);
            const dayIndex = Math.floor((wiltDate - todayStart) / 86400000);
            if (dayIndex < 0 || dayIndex >= 14) return;

            const normalizedName = f.name.replace(/^\d+/, ""); // 去掉前缀数字

            // 判断是单色还是双色
            const rareTargets = getRareTargetsFromDual(f.name);

            if (rareTargets.length === 0) {
              // 单色花：直接匹配花名
              if (normalizedName.includes(flowerName)) {
                singleColorCount += f.count;
              }
            } else {
              // 双色花：检查目标是否包含当前统计的珍稀花
              if (rareTargets.includes(flowerName)) {
                dualColorCount += f.count;
              }
            }
          });
        });

        // 单色花100% + 双色花50%
        const effectiveCount = singleColorCount + dualColorCount * 0.5;

        // 昙花特殊处理：48小时周期，14天内会枯萎7轮
        const isEphemeral = flowerName.includes('昙花');
        const multiplier = isEphemeral ? 7 : 1;

        return effectiveCount * multiplier;
      }

      // 计算预计完成天数
      // 注意：getFlowerWiltCount14Days 已经考虑了昙花的7倍乘数
      // 所以这里直接除以14就是每天平均可获得数量
      function getEstimatedDays(flowerName, needed, owned) {
        const remaining = needed - owned;
        if (remaining <= 0) return 0;
        const effectiveCount14 = getFlowerWiltCount14Days(flowerName);
        if (effectiveCount14 <= 0) return null; // 无法计算
        const perDay = effectiveCount14 / 14;
        const days = remaining / perDay;
        return Math.ceil(days);
      }

      // 统计账号中某花的实际数量（单色+双色），只统计有枯萎时间记录的花
      // 返回 { single: 单色数量, dual: 双色数量 }
      function getAccountFlowerStats(flowerName) {
        let single = 0;
        let dual = 0;
        // 规范化目标花名：去掉"花"字后缀，用于模糊匹配
        const normalizedTarget = flowerName.replace(/花$/, "");
        accounts.forEach(a => {
          a.flowers.forEach(f => {
            // 只统计有枯萎时间记录的花
            if (f.revivalTime === null) return;
            const normalizedName = f.name.replace(/^\d+/, "");
            const rareTargets = getRareTargetsFromDual(f.name);
            if (rareTargets.length === 0) {
              // 单色花：去掉"花"字后模糊匹配
              const nameWithoutFlower = normalizedName.replace(/花$/, "");
              if (nameWithoutFlower === normalizedTarget) {
                single += f.count;
              }
            } else {
              // 双色花：目标包含该珍稀花（也做模糊匹配）
              const matched = rareTargets.some(target => {
                const targetWithoutFlower = target.replace(/花$/, "");
                return targetWithoutFlower === normalizedTarget;
              });
              if (matched) {
                dual += f.count;
              }
            }
          });
        });
        return { single, dual };
      }

      // 更新收集进度的 owned（复活时调用）
      function addToCollection(flowerName, count) {
        setCollectionGoals(prev => {
          const current = prev[flowerName] || { needed: 0, owned: 0 };
          return {
            ...prev,
            [flowerName]: {
              ...current,
              owned: current.owned + count,
            },
          };
        });
      }

      // 设置收集目标
      function setCollectionGoal(flowerName, needed, owned) {
        setCollectionGoals(prev => ({
          ...prev,
          [flowerName]: { needed, owned },
        }));
      }

      // 删除收集目标
      function removeCollectionGoal(flowerName) {
        setCollectionGoals(prev => {
          const next = { ...prev };
          delete next[flowerName];
          return next;
        });
      }

      // ========== 【调试】暴露 accounts 到 window，方便 Console 调试 ==========
      useEffect(() => {
        window.__debugAccounts = accounts;
        window.__debugGetExpired = () => {
          const result = [];
          accounts.forEach(a => {
            a.flowers.forEach(f => {
              if (f.revivalTime === null) return;
              const rem = remMs(f);
              if (rem !== null && rem <= -86400000) {
                result.push({
                  accountId: a.accountId,
                  name: f.name,
                  count: f.count,
                  remMs: rem,
                  remDays: (rem / 86400000).toFixed(2),
                  revivalTime: new Date(f.revivalTime).toLocaleString('zh-CN'),
                  durationHours: f.durationMs / 3600000,
                });
              }
            });
          });
          console.log('=== 过期花朵调试 ===');
          console.log('过期总数:', result.reduce((s, r) => s + r.count, 0));
          console.log('过期明细:', result);
          return result;
        };
      }, [accounts]);

      // ========== 今日复活计数 ==========
      function incrementTodayRevived() {
        setTodayRevived(prev => {
          const newCount = prev + 1;
          localStorage.setItem(TODAY_KEY, JSON.stringify({
            date: new Date().toDateString(),
            count: newCount,
          }));
          return newCount;
        });
      }

      function saveFlowerRename(accountId, flowerId) {
        if (!editingFlower || !editingFlower.text.trim()) {
          setEditingFlower(null);
          return;
        }
        const text = editingFlower.text.trim();
        const m = text.match(/^(.+?)(\d+)$/);
        if (!m) {
          setEditingFlower(null);
          return;
        }
        const newName = m[1];
        const newCount = parseInt(m[2]);
        setAccounts(prev => prev.map(a =>
          a.accountId !== accountId ? a
            : { ...a, flowers: a.flowers.map(f => f.id === flowerId ? { ...f, name: newName, count: newCount } : f) }
        ));
        setEditingFlower(null);
      }

      function saveAccountRename(oldAccountId) {
        if (!editingFlower || !editingFlower.text.trim()) {
          setEditingFlower(null);
          return;
        }
        const newAccountId = editingFlower.text.trim();
        if (!newAccountId || newAccountId === oldAccountId) {
          setEditingFlower(null);
          return;
        }
        // 检查是否已存在
        if (accounts.some(a => a.accountId === newAccountId && a.accountId !== oldAccountId)) {
          alert("该账号ID已存在！");
          setEditingFlower(null);
          return;
        }
        setAccounts(prev => prev.map(a =>
          a.accountId !== oldAccountId ? a : { ...a, accountId: newAccountId }
        ));

        // 同步迁移以 accountId 为键的附属数据，否则提醒 / 折叠 / 置顶会静默失效
        setAccountReminders(prev => {
          const next = new Set(prev);
          if (next.delete(oldAccountId)) next.add(newAccountId);
          writeJSON(REMINDER_KEY, Array.from(next));
          return next;
        });
        setCollapsedAccounts(prev => {
          const next = new Set(prev);
          if (next.delete(oldAccountId)) next.add(newAccountId);
          return next;
        });
        if (pinnedAccountId === oldAccountId) setPinnedAccountId(newAccountId);
        if (window.__reminderState?.[oldAccountId]) {
          window.__reminderState[newAccountId] = window.__reminderState[oldAccountId];
          delete window.__reminderState[oldAccountId];
        }

        setEditingFlower(null);
      }

      // ========== 【修改】doImport 使用新的 parseInput ==========
      function doImport() {
        // 格式1：旧格式（无剩余时长，自动检测 # 号），格式2：带剩余时长，无需 # 号
        const format1Result = importText.trim() ? parseInput(importText) : [];
        const format2Result = importText2.trim() ? parseInput(importText2, true) : [];

        // 合并两种格式的结果
        const allParsed = [...format1Result, ...format2Result];

        if (allParsed.length === 0) {
          setImportError("没有可导入的数据，请检查输入格式\n格式1：花名+数量 账号ID\n格式2：花名+数量 小时 分钟，账号ID单独一行");
          return;
        }

        setAccounts(prev => {
          const next = [...prev];
          for (const p of allParsed) {
            const idx = next.findIndex(a => a.accountId === p.accountId);
            if (idx === -1) next.push(p);
            else {
              const merged = [...next[idx].flowers];
              for (const f of p.flowers) {
                if (!merged.find(mf => mf.name === f.name)) merged.push(f);
              }
              next[idx] = { ...next[idx], flowers: merged };
            }
          }
          return next;
        });

        // 清理提醒：只保留当前存在的账号
        setAccountReminders(prev => {
          const currentIds = new Set(accounts.map(a => a.accountId));
          allParsed.forEach(p => currentIds.add(p.accountId));
          const newSet = new Set([...prev].filter(id => currentIds.has(id)));
          localStorage.setItem(REMINDER_KEY, JSON.stringify(Array.from(newSet)));
          return newSet;
        });

        setImportText(""); setImportText2(""); setImportError(""); setShowImport(false);
      }

      function reviveOne(accountId, flowerId) {
        const now = Date.now();
        const account = accounts.find(a => a.accountId === accountId);
        const flower = account ? account.flowers.find(fl => fl.id === flowerId) : null;
        const addCount = flower ? flower.count : 0;
        // 用「账号ID|花名」做今日去重键，uid 在导入备份后会重新生成
        const todayKey = flower ? stableFlowerKey(accountId, flower.name) : null;

        // 检查是否是双色花
        const rareTargets = flower ? getRareTargetsFromDual(flower.name) : [];
        if (rareTargets.length > 0) {
          // 双色花：弹出分配弹窗
          setDualColorModal({
            mode: 'single',
            flowerName: flower.name,
            count: addCount,
            targets: rareTargets,
            allocations: rareTargets.map(() => 0),
            onConfirm: (allocations) => {
              // 用户确认后执行复活
              setAccounts(prev => prev.map(a =>
                a.accountId !== accountId ? a
                  : { ...a, flowers: a.flowers.map(fl => fl.id === flowerId ? { ...fl, revivalTime: now, durationMs: fl.name.includes('昙花') ? EPHEMERAL_MS : DEFAULT_MS } : fl) }
              ));

              if (addCount > 0 && todayKey && !revivedTodayIds.has(todayKey)) {
                setTodayRevived(prev => {
                  const newCount = prev + addCount;
                  localStorage.setItem(TODAY_KEY, JSON.stringify({
                    date: new Date().toDateString(),
                    count: newCount,
                  }));
                  return newCount;
                });

                setRevivedTodayIds(prev => {
                  const newSet = new Set(prev);
                  newSet.add(todayKey);
                  localStorage.setItem(TODAY_IDS_KEY, JSON.stringify({
                    date: new Date().toDateString(),
                    ids: Array.from(newSet),
                  }));
                  return newSet;
                });

                // 更新收集进度
                allocations.forEach((count, idx) => {
                  if (count > 0) {
                    addToCollection(rareTargets[idx], count);
                  }
                });
              }
              setDualColorModal(null);
            },
          });
          return;
        }

        // 单色花：直接复活
        setAccounts(prev => prev.map(a =>
          a.accountId !== accountId ? a
            : { ...a, flowers: a.flowers.map(fl => fl.id === flowerId ? { ...fl, revivalTime: now, durationMs: fl.name.includes('昙花') ? EPHEMERAL_MS : DEFAULT_MS } : fl) }
        ));

        if (addCount > 0 && todayKey && !revivedTodayIds.has(todayKey)) {
          setTodayRevived(prev => {
            const newCount = prev + addCount;
            localStorage.setItem(TODAY_KEY, JSON.stringify({
              date: new Date().toDateString(),
              count: newCount,
            }));
            return newCount;
          });

          setRevivedTodayIds(prev => {
            const newSet = new Set(prev);
            newSet.add(todayKey);
            localStorage.setItem(TODAY_IDS_KEY, JSON.stringify({
              date: new Date().toDateString(),
              ids: Array.from(newSet),
            }));
            return newSet;
          });

          // 更新收集进度（如果该花在珍稀列表中）
          // 使用规范化花名（去掉前缀数字）匹配和存储
          const normalizedFlowerName = flower.name.replace(/^\d+/, "");
          if (flower && RARE_FLOWERS.includes(normalizedFlowerName)) {
            addToCollection(normalizedFlowerName, addCount);
          }
        }
      }

      function reviveAll(accountId) {
        const now = Date.now();
        const account = accounts.find(a => a.accountId === accountId);
        const allFlowers = account ? account.flowers : [];
        const newRevived = allFlowers.filter(f => !revivedTodayIds.has(stableFlowerKey(accountId, f.name)));

        // 分离单色花和双色花
        const singleColorFlowers = [];
        const dualColorFlowers = [];
        newRevived.forEach(f => {
          const rareTargets = getRareTargetsFromDual(f.name);
          if (rareTargets.length > 0) {
            dualColorFlowers.push({ ...f, rareTargets });
          } else {
            singleColorFlowers.push(f);
          }
        });

        // 如果有双色花，弹出汇总分配弹窗
        if (dualColorFlowers.length > 0) {
          setDualColorModal({
            mode: 'batch',
            flowers: dualColorFlowers,
            singleColorFlowers: singleColorFlowers,
            accountId: accountId,
            onConfirm: (allAllocations) => {
              // 确认后执行所有复活
              setAccounts(prev => prev.map(a =>
                a.accountId !== accountId ? a
                  : { ...a, flowers: a.flowers.map(f => ({ ...f, revivalTime: now, durationMs: f.name.includes('昙花') ? EPHEMERAL_MS : DEFAULT_MS })) }
              ));

              const totalAddCount = newRevived.reduce((sum, f) => sum + f.count, 0);
              if (totalAddCount > 0) {
                setTodayRevived(prev => {
                  const newCount = prev + totalAddCount;
                  localStorage.setItem(TODAY_KEY, JSON.stringify({ date: new Date().toDateString(), count: newCount }));
                  return newCount;
                });
                setRevivedTodayIds(prev => {
                  const newSet = new Set(prev);
                  newRevived.forEach(f => newSet.add(stableFlowerKey(accountId, f.name)));
                  localStorage.setItem(TODAY_IDS_KEY, JSON.stringify({ date: new Date().toDateString(), ids: Array.from(newSet) }));
                  return newSet;
                });

                // 更新单色花的收集进度
                singleColorFlowers.forEach(f => {
                  const normalizedName = f.name.replace(/^\d+/, "");
                  if (RARE_FLOWERS.includes(normalizedName)) {
                    addToCollection(normalizedName, f.count);
                  }
                });

                // 更新双色花的收集进度
                allAllocations.forEach(({ targets, allocations }) => {
                  allocations.forEach((count, idx) => {
                    if (count > 0) {
                      addToCollection(targets[idx], count);
                    }
                  });
                });
              }
              setDualColorModal(null);
            },
          });
          return;
        }

        // 只有单色花：直接复活
        const addCount = newRevived.reduce((sum, f) => sum + f.count, 0);

        setAccounts(prev => prev.map(a =>
          a.accountId !== accountId ? a
            : { ...a, flowers: a.flowers.map(f => ({ ...f, revivalTime: now, durationMs: f.name.includes('昙花') ? EPHEMERAL_MS : DEFAULT_MS })) }
        ));

        if (addCount > 0) {
          setTodayRevived(prev => {
            const newCount = prev + addCount;
            localStorage.setItem(TODAY_KEY, JSON.stringify({ date: new Date().toDateString(), count: newCount }));
            return newCount;
          });
          setRevivedTodayIds(prev => {
            const newSet = new Set(prev);
            newRevived.forEach(f => newSet.add(stableFlowerKey(accountId, f.name)));
            localStorage.setItem(TODAY_IDS_KEY, JSON.stringify({ date: new Date().toDateString(), ids: Array.from(newSet) }));
            return newSet;
          });

          // 更新收集进度
          singleColorFlowers.forEach(f => {
            const normalizedName = f.name.replace(/^\d+/, "");
            if (RARE_FLOWERS.includes(normalizedName)) {
              addToCollection(normalizedName, f.count);
            }
          });
        }
      }

      // ========== 【修改】打开设置弹窗时置顶该账号 ==========
      function openModal(accountId, flowerId, f) {
        const totalDurationMs = f.name.includes('昙花') ? EPHEMERAL_MS : DEFAULT_MS;
        let revivalTimeStr, hours;

        if (f.revivalTime !== null) {
          revivalTimeStr = toDatetimeLocal(f.revivalTime);
          const remainingHours = calcRemainingFromRevivalTime(f.revivalTime, totalDurationMs);
          hours = String(Math.max(0, Math.round(remainingHours * 10) / 10));
        } else {
          revivalTimeStr = toDatetimeLocal(Date.now());
          hours = String(Math.round(totalDurationMs / 3600000));
        }

        setModal({
          accountId, flowerId,
          hours,
          revivalTimeStr,
          totalDurationMs,
        });

        // 【新增】置顶该账号
        setPinnedAccountId(accountId);
      }

      function saveModal() {
        // 解析 hours（支持 "3.5" 或 "3 30"）
        let totalHours = null;
        const inputValue = modal.hours;

        if (inputValue.includes(' ')) {
          const parts = inputValue.trim().split(/\s+/);
          if (parts.length === 2) {
            const hours = parseFloat(parts[0]);
            const minutes = parseFloat(parts[1]);
            if (!isNaN(hours) && !isNaN(minutes)) {
              totalHours = hours + (minutes / 60);
            }
          }
        } else {
          totalHours = parseFloat(inputValue);
        }

        if (isNaN(totalHours) || totalHours < 0) return;

        const rt = modal.revivalTimeStr ? new Date(modal.revivalTimeStr).getTime() : null;
        setAccounts(prev => prev.map(a =>
          a.accountId !== modal.accountId ? a : {
            ...a,
            flowers: a.flowers.map(f =>
              f.id !== modal.flowerId ? f
                : { ...f, durationMs: modal.totalDurationMs, revivalTime: isNaN(rt) ? f.revivalTime : rt }
            ),
          }
        ));
        setModal(null);
      }

      function deleteAccount(id) {
        setAccounts(prev => prev.filter(a => a.accountId !== id));
        // 同步清理该账号的提醒记录
        setAccountReminders(prev => {
          const newSet = new Set(prev);
          newSet.delete(id);
          writeJSON(REMINDER_KEY, Array.from(newSet));
          // 同步清理状态记录
          if (window.__reminderState?.[id]) {
            delete window.__reminderState[id];
          }
          return newSet;
        });
        // 同步清理折叠与置顶记录
        setCollapsedAccounts(prev => {
          if (!prev.has(id)) return prev;
          const next = new Set(prev);
          next.delete(id);
          return next;
        });
        if (pinnedAccountId === id) setPinnedAccountId(null);
        setConfirmDel(null);
      }

      function deleteFlower(accountId, flowerId) {
        setAccounts(prev => prev.map(a =>
          a.accountId !== accountId ? a
            : { ...a, flowers: a.flowers.filter(f => f.id !== flowerId) }
        ));
      }

      async function copyText(text, id) {
        try {
          await navigator.clipboard.writeText(text);
          setCopiedId(id);
          setTimeout(() => setCopiedId(null), 1500);
        } catch {
          const ta = document.createElement("textarea");
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);
          setCopiedId(id);
          setTimeout(() => setCopiedId(null), 1500);
        }
      }

      function openAddModal(accountId) {
        setAddModal({ accountId, text: "", error: "" });
      }

      function doAddFlower() {
        if (!addModal || !addModal.text.trim()) return;
        const parts = addModal.text.trim().split(/\s+/);
        const newFlowers = [];
        for (const p of parts) {
          const m = p.match(/^(.+?)(\d+)$/);
          if (m) {
            const exists = accounts.find(a => a.accountId === addModal.accountId)?.flowers.some(f => f.name === m[1]);
            if (!exists) {
              newFlowers.push({ id: uid(), name: m[1], count: parseInt(m[2]), revivalTime: null, durationMs: DEFAULT_MS });
            }
          }
        }
        if (!newFlowers.length) {
          setAddModal(prev => ({ ...prev, error: "格式错误或花朵已存在，请使用 花名+数量 格式" }));
          return;
        }
        setAccounts(prev => prev.map(a =>
          a.accountId !== addModal.accountId ? a
            : { ...a, flowers: [...a.flowers, ...newFlowers] }
        ));
        setAddModal(null);
      }

      // ========== 【修改】排序逻辑：置顶账号永远在最前面 ==========
      const sorted = [...accounts].sort((a, b) => {
        // 【新增】置顶账号排在最前面
        if (a.accountId === pinnedAccountId && b.accountId !== pinnedAccountId) return -1;
        if (b.accountId === pinnedAccountId && a.accountId !== pinnedAccountId) return 1;

        // 新添加的账号（所有花都是未记录状态）排在最前面
        const aAllUnknown = a.flowers.every(f => f.revivalTime === null);
        const bAllUnknown = b.flowers.every(f => f.revivalTime === null);
        if (aAllUnknown && !bAllUnknown) return -1;
        if (!aAllUnknown && bAllUnknown) return 1;

        // 其余按最紧急的花排序（剩余时间越短越靠前）
        const minRem = acc => {
          const rs = acc.flowers.map(f => remMs(f)).filter(r => r !== null);
          return rs.length ? Math.min(...rs) : Infinity;
        };
        return minRem(a) - minRem(b);
      });

      // ========== 搜索过滤 ==========
      const filteredSorted = sorted.filter(account => {
        // 搜索"//"显示所有折叠账号
        if (searchText.trim() === "//") {
          return collapsedAccounts.has(account.accountId);
        }
        // 无搜索时：折叠的账号不显示
        if (!searchText.trim()) {
          return !collapsedAccounts.has(account.accountId);
        }
        // 有搜索关键词时：所有账号（包括折叠的）都参与匹配
        const query = searchText.trim().toLowerCase();
        // 匹配账号ID
        if (account.accountId.toLowerCase().includes(query)) return true;
        // 匹配花名（部分匹配）
        return account.flowers.some(f => f.name.toLowerCase().includes(query));
      });


      const collapsedStats = accounts.reduce((stats, a) => {
        if (!collapsedAccounts.has(a.accountId)) return stats;

        const wilted = a.flowers.filter(f => {
          if (f.revivalTime === null) return false;
          const rem = remMs(f);
          return rem !== null && rem <= 0;
        }).reduce((sum, f) => sum + f.count, 0);

        const unknown = a.flowers.filter(f => f.revivalTime === null).reduce((sum, f) => sum + f.count, 0);

        return {
          wilted: stats.wilted + wilted,
          unknown: stats.unknown + unknown,
        };
      }, { wilted: 0, unknown: 0 });

      const totalFlowers = accounts.reduce((s, a) =>
        s + a.flowers.reduce((sum, f) => sum + (f.count || 0), 0), 0);
      const wiltedCount = accounts.reduce((s, a) =>
        s + a.flowers.filter(f => {
          if (f.revivalTime === null) return false;
          const rem = remMs(f);
          return rem !== null && rem <= 0;
        }).reduce((sum, f) => sum + (f.count || 0), 0), 0);


      return (
        // ========== 【修改】根容器点击时取消置顶 ==========
        <div
          style={{ minHeight: "100vh", background: C.bg, color: C.text, padding: "16px 14px", boxSizing: "border-box" }}
          onClick={(e) => {
            // 只有点「空白背景」才取消置顶；点按钮 / 输入框不该顺带把置顶清掉
            if (!pinnedAccountId) return;
            if (e.target.closest && e.target.closest("button, input, textarea, select, label, a")) return;
            setPinnedAccountId(null);
          }}
        >
          <div style={{ maxWidth: 720, margin: "0 auto" }}>

            {/* ========== 固定顶部包裹层 ========== */}
            <div style={{
              position: "sticky",
              top: -16,
              zIndex: 100,
              marginTop: -16,
              paddingTop: 16,
            }}>

              {/* ========== 顶部标题栏 ========== */}
              <div style={{
                display: "flex",
                justifyContent: "space-between",
                alignItems: "flex-start",
                marginBottom: 10,
                background: C.bg,
                paddingBottom: 4,
                borderBottom: `1px solid ${C.border}`,
              }}>

                {/* 左侧：标题 + 统计 */}
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 20, fontWeight: 700, color: C.accent }}>🌸 花园复活追踪</div>
                  <div style={{ fontSize: 13, color: C.muted, marginTop: 4, paddingLeft: 2, lineHeight: 1.5 }}>
                    <div>{accounts.length} 个账号 · {totalFlowers} 朵花{wiltedCount > 0 && <span style={{ color: C.wilted, marginLeft: 8 }}>· {wiltedCount} 朵已枯萎</span>}</div>

                    color: C.wilted,

                gap: 10,

                {(() => {
                  // 搜索过滤
                  let entries = Object.entries(collectionGoals);
                  if (collectionSearch.trim()) {
                    const q = collectionSearch.trim().toLowerCase();
                    entries = entries.filter(([name]) => name.toLowerCase().includes(q));
                  }

                  // 预计算：每个花的进度、预计天数、统计（避免排序和渲染时重复计算）
                  const computed = new Map();
                  entries.forEach(([name, goal]) => {
                    const progress = goal.needed > 0 ? goal.owned / goal.needed : 0;
                    const estimatedDays = goal.needed > 0 ? getEstimatedDays(name, goal.needed, goal.owned) : null;
                    const stats = getAccountFlowerStats(name);
                    computed.set(name, { progress, estimatedDays, stats });
                  });

                  // 排序
                  entries.sort(([nameA, a], [nameB, b]) => {
                    const ca = computed.get(nameA);
                    const cb = computed.get(nameB);

                    switch (collectionSort) {
                      case "progress":
                        return ca.progress - cb.progress;
                      case "progressDesc":
                        return cb.progress - ca.progress;
                      case "name":
                        return nameA.localeCompare(nameB, "zh-CN");
                      case "nameDesc":
                        return nameB.localeCompare(nameA, "zh-CN");
                      case "earliest":
                        if (ca.estimatedDays === null && cb.estimatedDays === null) return 0;
                        if (ca.estimatedDays === null) return 1;
                        if (cb.estimatedDays === null) return -1;
                        return ca.estimatedDays - cb.estimatedDays;
                      case "latest":
                        if (ca.estimatedDays === null && cb.estimatedDays === null) return 0;
                        if (ca.estimatedDays === null) return 1;
                        if (cb.estimatedDays === null) return -1;
                        return cb.estimatedDays - ca.estimatedDays;
                      default:
                        return 0;
                    }
                  });

                    return (
                      <div style={{ textAlign: "center", color: C.muted, fontSize: 13, padding: "20px 0" }}>
                        {Object.entries(collectionGoals).length === 0
                          ? "暂无收集目标，点击上方添加"
                          : "没有匹配的目标花"}
                      </div>
                    );
                  }

                  return entries.map(([flowerName, goal]) => {
                    const c = computed.get(flowerName);
                    const progress = Math.min(c.progress, 1);
                    const remaining = goal.needed - goal.owned;
                    const estimatedDays = c.estimatedDays;
                    const isCompleted = goal.needed > 0 && goal.owned >= goal.needed;
                    const hasStats = c.stats.single > 0 || c.stats.dual > 0;

                    return (
                      <div key={flowerName} style={{
                        padding: 10,
                        background: isDark ? "rgba(255,255,255,0.05)" : "rgba(0,0,0,0.03)",
                        borderRadius: 8,
                        flexShrink: 0,

                        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 6 }}>
                          <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                            <span style={{ fontSize: 14, fontWeight: 600, color: C.text }}>{flowerName}</span>
                            {hasStats && (
                              <span style={{
                                fontSize: 11,
                                color: C.muted,
                                background: isDark ? "rgba(255,255,255,0.08)" : "rgba(0,0,0,0.06)",
                                padding: "1px 8px",
                                borderRadius: 10,
                              }}>
                                {c.stats.single}+{c.stats.dual}
                              </span>
                            )}
                          </div>
                          <div style={{ display: "flex", gap: 4, alignItems: "center" }}>
                            <button
                              onClick={() => {
                                setCollectionAddModal({
                                  flowerName: flowerName,
                                  originalName: flowerName,
                                  needed: goal.needed,
                                  owned: goal.owned,
                                  isEdit: true,
                                });
                              }}
                              style={{ background: "transparent", border: "none", color: C.muted, fontSize: 12, cursor: "pointer" }}
                              title="编辑"
                            >✏️</button>
                            <input
                              type="checkbox"
                              onChange={e => {
                                setCollectionGoals(prev => ({
                                  ...prev,
                                  [flowerName]: { ...prev[flowerName], _selected: e.target.checked },
                                }));
                              }}
                              style={{ cursor: "pointer", width: 16, height: 16 }}
                              title="勾选以批量删除"
                            />
                          </div>
                        </div>

                        {/* 进度条 */}
                        <div style={{
                          height: 6,
                          background: isDark ? "rgba(255,255,255,0.1)" : "rgba(0,0,0,0.08)",
                          borderRadius: 3,
                          overflow: "hidden",
                          marginBottom: 6,
                        }}>
                          <div style={{
                            height: "100%",
                            width: `${progress * 100}%`,
                            background: goal.needed === 0
                              ? C.muted
                              : isCompleted
                                ? C.alive
                                : progress > 0.5
                                  ? C.urgent
                                  : C.wilted,
                            borderRadius: 3,
                            transition: "width 0.3s ease",
                          }} />
                        </div>

                        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12 }}>
                          <span style={{ color: C.muted }}>
                            {goal.owned} / {goal.needed}
                            {goal.needed === 0
                              ? "（未设置目标）"
                              : isCompleted
                                ? " ✓ 已完成"
                                : `（还缺 ${remaining}）`}
                          </span>
                          <span style={{ color: goal.needed === 0 ? C.muted : (isCompleted ? C.alive : C.urgent) }}>
                            {goal.needed === 0
                              ? "点击编辑设置目标"
                              : isCompleted
                                ? "已完成"
                                : estimatedDays === null
                                  ? "暂无数据"
                                  : estimatedDays === 0
                                    ? "即将完成"
                                    : `预计 ${estimatedDays} 天`}
                          </span>
                        </div>
                      </div>
                    );
                  });
                })()}
              </div>
            </div>

          {/* ========== 添加目标花弹窗 ========== */}
          {collectionAddModal && (
            <div
              style={{

              onClick={e => e.stopPropagation()}
            >
              <div style={{
                background: isDark ? "rgba(24, 20, 31, 0.85)" : "rgba(255, 255, 255, 0.85)",
                backdropFilter: "blur(16px)",
                WebkitBackdropFilter: "blur(16px)",
                border: `1px solid ${isDark ? "rgba(180, 143, 208, 0.2)" : "rgba(123, 79, 160, 0.2)"}`,
                borderRadius: 12,
                padding: 20,
                width: "100%",
                maxWidth: 360,
              }}>
                <div style={{ fontSize: 16, fontWeight: 700, color: C.accent, marginBottom: 16 }}>
                  {collectionAddModal.isEdit ? `编辑 ${collectionAddModal.flowerName}` : "添加收集目标"}

                    style={{
                      width: "100%",
                      background: C.inputBg,
                      border: `1px solid ${C.border}`,
