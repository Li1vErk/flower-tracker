      // ========== 后台运行心跳 ==========
      // 每 10 秒记一次「相邻两次心跳的实际间隔」。最小化 / 切后台时若被冻结，
      // 间隔会出现远大于 10 秒的空档 —— 这是判断「提醒会不会失效」最直接的证据。
      // 面板关闭时不 setState（避免整页无谓重渲染），只累计数据。
      useEffect(() => {
        const hb = {
          startedAt: Date.now(), lastAt: Date.now(), ticks: 0,
          maxGap: 0, maxGapAt: null, freezes: 0, throttles: 0,
        };
        hbRef.current = hb;
        window.__hb = hb; // 便于控制台核对 / 自动化测试
        const iv = setInterval(() => {
          const now = Date.now();
          const gap = now - hb.lastAt;
          hb.lastAt = now;
          hb.ticks += 1;
          if (gap > hb.maxGap) { hb.maxGap = gap; hb.maxGapAt = now; }
          const kind = hbJudge(gap);
          if (kind === "freeze") hb.freezes += 1;
          else if (kind === "throttle") hb.throttles += 1;
          if (showBackupRef.current) setHbVersion(v => v + 1);
        }, HB_TICK_MS);
        return () => clearInterval(iv);
      }, []);

      // 面板打开时立即刷一次，否则要等最多 10 秒才看到最新统计
      useEffect(() => {
        showBackupRef.current = showBackup;
        if (showBackup) setHbVersion(v => v + 1);
      }, [showBackup]);

      function resetHb() {
        const hb = hbRef.current;
        if (!hb) return;
        hb.startedAt = Date.now();
        hb.lastAt = Date.now();
        hb.ticks = 0; hb.maxGap = 0; hb.maxGapAt = null; hb.freezes = 0; hb.throttles = 0;
        setHbVersion(v => v + 1);
      }

      useEffect(() => {
        const t = setInterval(() => setTick(n => n + 1), 20000);
        return () => clearInterval(t);
      }, []);

      useEffect(() => {
        const checkDayChange = () => {
          const today = new Date().toDateString();
          const saved = localStorage.getItem(TODAY_KEY);
          if (saved) {
            const { date } = JSON.parse(saved);
            if (date !== today) {
              setTodayRevived(0);
              localStorage.setItem(TODAY_KEY, JSON.stringify({ date: today, count: 0 }));
            }
          }
          // 跨零点时今日复活记录也要清（只清额度会出现「复活不了／日历对不上」）
          const savedIds = localStorage.getItem(TODAY_IDS_KEY);
          if (savedIds) {
            const { date } = JSON.parse(savedIds);
            if (date !== today) {
              setRevivedTodayIds(new Set());
              setRevivedTodayBatchIds(new Set());
              localStorage.setItem(TODAY_IDS_KEY, JSON.stringify({ date: today, ids: [], todayWiltIds: [] }));
            }
          }
        };
        const interval = setInterval(checkDayChange, 60000);
        return () => clearInterval(interval);
      }, []);

      // ========== 日历过渡动画控制 ==========
      useEffect(() => {
        if (showCalendar) {
          setCalendarVisible(true);
          requestAnimationFrame(() => setCalendarAnimating(true));
        } else {
          setCalendarAnimating(false);
          const timer = setTimeout(() => setCalendarVisible(false), 350);
          return () => clearTimeout(timer);
        }
      }, [showCalendar]);

      // ========== 添加花朵弹窗过渡动画控制 ==========
      useEffect(() => {
        if (addModal) {
          setAddModalVisible(true);
          requestAnimationFrame(() => setAddModalAnimating(true));
        } else {
          setAddModalAnimating(false);
          const timer = setTimeout(() => setAddModalVisible(false), 250);
          return () => clearTimeout(timer);
        }
      }, [addModal]);

      // ========== 编辑弹窗过渡动画控制 ==========
      useEffect(() => {
        if (modal) {
          setEditModalVisible(true);
          requestAnimationFrame(() => setEditModalAnimating(true));
        } else {
          setEditModalAnimating(false);
          const timer = setTimeout(() => setEditModalVisible(false), 250);
          return () => clearTimeout(timer);
        }
      }, [modal]);

      useEffect(() => {
        localStorage.setItem(COLLAPSED_KEY, JSON.stringify(Array.from(collapsedAccounts)));
      }, [collapsedAccounts]);

      // 展开状态不持久化，刷新后默认收起（无需写入 localStorage）

      async function setAccountReminder(accountId) {
        // 页面内提醒不需要任何权限，直接切换提醒状态
        doSetAccountReminder(accountId);
      }

      function doSetAccountReminder(accountId) {
        const newSet = new Set(accountReminders);
        if (newSet.has(accountId)) {
          newSet.delete(accountId);
          // 清除该账号的状态记录
          if (window.__reminderState?.[accountId]) {
            delete window.__reminderState[accountId];
          }
        } else {
          newSet.add(accountId);
        }
        setAccountReminders(newSet);
        localStorage.setItem(REMINDER_KEY, JSON.stringify(Array.from(newSet)));
      }

      // ========== 备份：导出（范围与分享码共用 shareScope） ==========
      function exportData() {
        const scope = shareScope || "full";
        const payload = buildBackup(scope);
        if (scope !== "prefs" && !payload.accounts.length) {
          setBackupMsg({ type: "err", text: "还没有任何账号数据，先添加账号再导出（或把范围切成「仅设置」）。" });
          return;
        }
        const json = JSON.stringify(payload, null, 2);
        const blob = new Blob([json], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        const d = new Date();
        const p = n => String(n).padStart(2, "0");
        const scopeTag = scope === "accounts" ? "仅账号" : scope === "prefs" ? "仅设置" : "全量";
        a.download = `花园复活追踪备份_${scopeTag}_${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}_${p(d.getHours())}-${p(d.getMinutes())}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        const goalCount = Object.keys(payload.collectionGoals).length;
        const sizeKb = Math.max(1, Math.round(json.length / 1024));
        setBackupMsg({
          type: "ok",
          text: `已导出（${scopeTag}，约 ${sizeKb} KB）：${payload.accounts.length} 个账号 · ${goalCount} 个收集目标`
            + (scope === "accounts" ? "。" : " · 含提醒/折叠/排序/主题设置。"),
        });
      }

      // ========== 备份：从文件读取（只解析，不直接落库） ==========
      function importData(file) {
        const reader = new FileReader();
        reader.onload = e => {
          let payload = null;
          try {
            payload = parseBackup(e.target.result);
          } catch {
            setBackupMsg({ type: "err", text: "无法解析该文件，请确认是本工具导出的 JSON 备份。" });
            return;
          }
          if (!payload) {
            setBackupMsg({ type: "err", text: "这不是「花园复活追踪」的备份文件。" });
            return;
          }
          if (!payload.accounts.length) {
            setBackupMsg({ type: "err", text: "备份里没有任何账号数据。" });
            return;
          }
          setPendingRestore({ backup: payload, source: "文件" });
        };
        reader.readAsText(file);
      }

      // ========== 备份：应用（覆盖 / 合并 / 只导配置） ==========
      function applyBackup(payload, mode) {
        const prefs = payload.prefs || {};
        const incoming = payload.accounts || [];
        const snapshotJson = localStorage.getItem(STORAGE_KEY);

        // 先算出最终账号集，后面的偏好设置要按它过滤，避免留下指向不存在账号的键
        let finalAccounts = accounts;
        if (mode !== "prefsOnly") {
          finalAccounts = mode === "merge"
            ? mergeAccountList(accounts, incoming)
            : incoming.map(a => ({
              id: a.id || uid(),
              accountId: a.accountId,
              flowers: (a.flowers || []).map(f => ({ ...f, id: f.id || uid() })),
            }));
          if (snapshotJson) {
            pushSnapshot(snapshotJson);
            loadSnapshots();
          }
          setAccounts(finalAccounts);
          if (payload.collectionGoals && Object.keys(payload.collectionGoals).length) {
            setCollectionGoals(prev => (mode === "merge"
              ? mergeGoals(prev, payload.collectionGoals)
              : stripSelected(payload.collectionGoals)));
          }
        }

        const validIds = new Set(finalAccounts.map(a => a.accountId));

        // 偏好设置：合并模式取并集，覆盖 / 只导配置直接以备份为准
        if (prefs.theme === "dark" || prefs.theme === "light") {
          setTheme(prefs.theme);
          localStorage.setItem(THEME_KEY, prefs.theme);
        }
        if (typeof prefs.collectionSort === "string" && prefs.collectionSort) {
          setCollectionSort(prefs.collectionSort);
        }
        setAccountReminders(prev => {
          const base = mode === "merge" ? prev : new Set();
          const next = new Set([...base, ...(prefs.accountReminders || [])].filter(id => validIds.has(id)));
          writeJSON(REMINDER_KEY, Array.from(next));
          return next;
        });
        setCollapsedAccounts(prev => {
          const base = mode === "merge" ? prev : new Set();
          return new Set([...base, ...(prefs.collapsedAccounts || [])].filter(id => validIds.has(id)));
        });
        // 「不着急」标记按花种存，与账号 ID 无关，因此不做 validIds 过滤
        setLowPriorityKinds(prev => {
          const base = mode === "merge" ? prev : new Set();
          return new Set([...base, ...(prefs.lowPriorityKinds || [])]);
        });
        if (prefs.pinnedAccount && validIds.has(prefs.pinnedAccount)) {
          setPinnedAccountId(prefs.pinnedAccount);
        } else if (mode !== "merge") {
          setPinnedAccountId(null);
        }

        const modeText = mode === "merge" ? "合并导入" : mode === "prefsOnly" ? "仅导入设置" : "覆盖导入";
        const source = pendingRestore ? pendingRestore.source : "备份";
        setPendingRestore(null);
        setBackupMsg({
          type: "ok",
          text: `${modeText}完成（来自${source}）：当前 ${finalAccounts.length} 个账号。`,
        });
      }

      // ========== 备份：分享码 ==========
      const SHARE_SCOPES = [
        { id: "full", label: "全量", hint: "账号 + 收集 + 设置" },
        { id: "accounts", label: "仅账号", hint: "只带账号数据，码最短" },
        { id: "prefs", label: "仅设置", hint: "主题 / 排序 / 提醒 / 折叠 / 置顶" },
      ];
      function shareScopeLabel(id) {
        return (SHARE_SCOPES.find(s => s.id === id) || SHARE_SCOPES[0]).label;
      }
      function generateShareCode() {
        const payload = buildBackup(shareScope);
        if (shareScope !== "prefs" && !payload.accounts.length) {
          setBackupMsg({ type: "err", text: "还没有账号数据可以生成分享码，可切换为「仅设置」。" });
          return;
        }
        const code = encodeShare(payload);
        if (!code) {
          setBackupMsg({ type: "err", text: "生成失败，请刷新页面后重试。" });
          return;
        }
        setShareCode(code);
        setBackupMsg({
          type: "ok",
          text: `分享码已生成（${shareScopeLabel(shareScope)} · ${code.length} 字符）${window.LZString ? "" : " · 压缩库未加载，码较长但不影响使用"}，复制到另一台设备粘贴即可。`,
        });
      }

      function importShareCode() {
        const text = sharePaste.trim();
        if (!text) {
          setBackupMsg({ type: "err", text: "请先粘贴分享码。" });
          return;
        }
        const decoded = decodeShare(text);
        if (!decoded) {
          setBackupMsg({ type: "err", text: "分享码无法识别，请确认复制完整（不要漏掉结尾）。" });
          return;
        }
        let payload = null;
        try { payload = parseBackup(decoded); } catch { payload = null; }
        const hasAccounts = payload && payload.accounts.length > 0;
        const hasPrefs = payload && (Object.keys(payload.prefs || {}).length > 0 || Object.keys(payload.collectionGoals || {}).length > 0);
        if (!payload || (!hasAccounts && !hasPrefs)) {
          setBackupMsg({ type: "err", text: "分享码内容不完整或不是本工具的分享码。" });
          return;
        }
        setPendingRestore({ backup: payload, source: "分享码" });
      }

      // ========== 备份：自动快照 ==========
      function loadSnapshots() {
        const list = readJSON(SNAPSHOT_KEY, []);
        setSnapshots(Array.isArray(list) ? list : []);
      }

      function restoreSnapshot(snap) {
        if (!snap || !snap.data) return;
        try {
          const parsed = JSON.parse(snap.data);
          if (!Array.isArray(parsed)) return;
          const current = localStorage.getItem(STORAGE_KEY);
          if (current) pushSnapshot(current);
          setAccounts(parsed);
          loadSnapshots();
          setBackupMsg({ type: "ok", text: `已恢复到 ${fmtBackupTime(new Date(snap.at).toISOString())} 的快照。` });
        } catch {
          setBackupMsg({ type: "err", text: "该快照已损坏，无法恢复。" });
        }
      }

      function clearSnapshots() {
        localStorage.removeItem(SNAPSHOT_KEY);
        setSnapshots([]);
        setBackupMsg({ type: "ok", text: "自动快照已清空。" });
      }

      // 打开备份面板时刷新一次快照列表
      useEffect(() => {
        if (showBackup) loadSnapshots();
      }, [showBackup]);

      // 备份面板里的提示 6 秒后自动消失
      useEffect(() => {
        if (!backupMsg || backupMsg.type === "err") return;
        const t = setTimeout(() => setBackupMsg(null), 6000);
        return () => clearTimeout(t);
      }, [backupMsg]);

      // ========== 云同步：整份快照 + 版本号（LWW，冲突时让用户选） ==========
      // 同步区：账号 / 收集目标 / 今日额度（含 todayWiltIds）/ 不着急标记。
      // 本地区（各设备独立）：主题、排序、折叠、置顶、提醒、自动快照、同步配置本身。
      // 语义：本机改动 → 延迟推送到云端（带 baseRev 乐观锁）；
      //       云端有更新 → 本机没改动就直接采纳，有改动就弹冲突窗让用户决定谁覆盖谁。
      const [syncUrl, setSyncUrl] = useState(() => localStorage.getItem(SYNC_URL_KEY) || "");
      const [syncToken, setSyncToken] = useState(() => localStorage.getItem(SYNC_TOKEN_KEY) || "");
      const [syncDevice, setSyncDevice] = useState(() => localStorage.getItem(SYNC_DEVICE_KEY) || "");
      const [syncOn, setSyncOn] = useState(() => localStorage.getItem(SYNC_ON_KEY) === "1");
      const [syncStatus, setSyncStatus] = useState({ phase: "idle", at: null, rev: null, err: null });
      const [syncConflict, setConflictStateRaw] = useState(null); // { rev, updatedAt, device, payload }

      function setConflictState(c) {
        syncConflictRef.current = c;
        setConflictStateRaw(c);
      }

      const syncRevRef = React.useRef(0);            // 已知的云端版本号
      const syncLastJsonRef = React.useRef(null);    // 与云端对齐时的本机内容（ canonical json ）
      const syncReadyRef = React.useRef(false);      // 首次拉取是否完成（完成前不自动推送，防误覆盖）
      const syncBusyRef = React.useRef(false);       // 拉取 / 推送防重入
      const syncPushTimerRef = React.useRef(null);
      const syncDismissedRevRef = React.useRef(0);   // 用户点「稍后」的冲突版本，自动拉取不再打扰
      const syncEnabledRef = React.useRef(false);
      const syncConflictRef = React.useRef(null);    // state 的镜像，异步回调里读的是最新值
      const syncPushPendingRef = React.useRef(false); // 忙时被撞掉的推送，忙完补推

      // 同步元信息：谁的数据、什么时候检查/拉取/推送过（给面板状态行显示，能看出卡在哪一步）
      const syncMetaRef = React.useRef({ checkedAt: null, pulledAt: null, pushedAt: null, fromDevice: null, fromAt: null });
      const [syncMeta, setSyncMeta] = useState(syncMetaRef.current);
      function touchSyncMeta(patch) {
        syncMetaRef.current = { ...syncMetaRef.current, ...patch };
        setSyncMeta(syncMetaRef.current);
      }
      // 忙时被撞掉的推送先记一笔，等这次同步结束再补推，不用干等下一轮
      function retryPendingPush() {
        if (!syncPushPendingRef.current) return;
        syncPushPendingRef.current = false;
        schedulePush();
      }

      // 快照内容只从 localStorage 读：与渲染时机无关，任何回调（定时器 / pagehide）取到的都是最新值。
      // 字段顺序固定，两边用同一份代码生成，json 字符串可直接比较。
      function buildSyncPayload() {
        const today = new Date().toDateString();
        const t = readJSON(TODAY_KEY, null);
        const ids = readJSON(TODAY_IDS_KEY, null);
        return {
          _app: BACKUP_APP,
          _kind: "sync",
          _version: 1,
          accounts: readJSON(STORAGE_KEY, []),
          collectionGoals: stripSelected(readJSON(COLLECTION_KEY, {})),
          today: t && t.date === today ? { date: today, count: t.count || 0 } : { date: today, count: 0 },
          todayIds: ids && ids.date === today
            ? { date: today, ids: Array.isArray(ids.ids) ? ids.ids : [], todayWiltIds: Array.isArray(ids.todayWiltIds) ? ids.todayWiltIds : [] }
            : { date: today, ids: [], todayWiltIds: [] },
          lowPriorityKinds: readJSON(LOW_PRIORITY_KEY, []),
        };
      }
      function syncCanonicalJson() { return JSON.stringify(buildSyncPayload()); }

      function persistSyncState(rev, json) {
        writeJSON(SYNC_STATE_KEY, { rev, json, at: Date.now(), meta: syncMetaRef.current });
      }

      function deviceName() {
        return localStorage.getItem(SYNC_DEVICE_KEY) || "未知设备";
      }

      async function syncFetch(url, options = {}) {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), SYNC_FETCH_TIMEOUT_MS);
        try {
          return await fetch(url, { ...options, signal: ctrl.signal });
        } finally {
          clearTimeout(timer);
        }
      }

      function friendlySyncErr(e) {
        if (e && (e.name === "AbortError" || /aborted/i.test(e.message || ""))) return "连接超时";
        if (e instanceof TypeError || /fetch|network/i.test(e.message || "")) return "连不上同步服务";
        return e && e.message ? e.message : "未知错误";
      }

      function syncEndpoint() {
        return (localStorage.getItem(SYNC_URL_KEY) || "").replace(/\/+$/, "") + "/snapshot";
      }

      // 把云端快照落到本机（先写存储再改状态，持久化 effect 会原样再写一遍，无副作用）
      function applySyncPayload(p) {
        const accs = Array.isArray(p.accounts) ? p.accounts.map(a => ({
          id: a.id || uid(),
          accountId: a.accountId,
          flowers: (a.flowers || []).map(f => ({ ...f, id: f.id || uid() })),
        })) : [];
        localStorage.setItem(STORAGE_KEY, JSON.stringify(accs));
        setAccounts(accs);

        const goals = stripSelected(p.collectionGoals || {});
        localStorage.setItem(COLLECTION_KEY, JSON.stringify(goals));
        setCollectionGoals(goals);

        const today = new Date().toDateString();
        const t = p.today && p.today.date === today ? p.today : { date: today, count: 0 };
        localStorage.setItem(TODAY_KEY, JSON.stringify(t));
        setTodayRevived(t.count || 0);

        const ids = p.todayIds && p.todayIds.date === today
          ? p.todayIds
          : { date: today, ids: [], todayWiltIds: [] };
        localStorage.setItem(TODAY_IDS_KEY, JSON.stringify({
          date: today,
          ids: Array.isArray(ids.ids) ? ids.ids : [],
          todayWiltIds: Array.isArray(ids.todayWiltIds) ? ids.todayWiltIds : [],
        }));
        setRevivedTodayIds(new Set(Array.isArray(ids.ids) ? ids.ids : []));
        setRevivedTodayBatchIds(new Set(Array.isArray(ids.todayWiltIds) ? ids.todayWiltIds : []));

        const lp = Array.isArray(p.lowPriorityKinds) ? p.lowPriorityKinds : [];
        localStorage.setItem(LOW_PRIORITY_KEY, JSON.stringify(lp));
        setLowPriorityKinds(new Set(lp));
      }

      function adoptRemote(payload, rev) {
        applySyncPayload(payload || {});
        const json = syncCanonicalJson();
        syncRevRef.current = rev;
        syncLastJsonRef.current = json;
        touchSyncMeta({ pulledAt: Date.now() });
        persistSyncState(rev, json);
        setSyncStatus({ phase: "ok", at: Date.now(), rev, err: null });
      }

      async function doPush(json, baseRev) {
        if (!syncEnabledRef.current) return;
        if (syncBusyRef.current) {
          // 正有同步在跑：把这次改动挂起，等它结束立刻补推（不用干等下一轮）
          syncPushPendingRef.current = true;
          return;
        }
        syncBusyRef.current = true;
        setSyncStatus(s => ({ ...s, phase: "syncing" }));
        try {
          const res = await syncFetch(syncEndpoint(), {
            method: "PUT",
            headers: { "content-type": "application/json", "X-Sync-Token": localStorage.getItem(SYNC_TOKEN_KEY) || "" },
            body: JSON.stringify({ baseRev, device: deviceName(), payload: JSON.parse(json) }),
          });
          if (res.status === 401) throw new Error("同步口令不对");
          if (res.status === 409) {
            const c = await res.json();
            touchSyncMeta({ checkedAt: Date.now(), fromDevice: c.device || null, fromAt: c.updatedAt || null });
            setConflictState({ rev: c.rev || 0, updatedAt: c.updatedAt || null, device: c.device || null, payload: c.payload || null });
            setSyncStatus({ phase: "conflict", at: Date.now(), rev: c.rev || 0, err: null });
            return;
          }
          if (!res.ok) throw new Error("服务返回 " + res.status);
          const data = await res.json();
          syncRevRef.current = data.rev;
          syncLastJsonRef.current = json;
          touchSyncMeta({
            checkedAt: Date.now(), pushedAt: Date.now(),
            fromDevice: deviceName(), fromAt: data.updatedAt || new Date().toISOString(),
          });
          persistSyncState(data.rev, json);
          setConflictState(null);
          setSyncStatus({ phase: "ok", at: Date.now(), rev: data.rev, err: null });
        } catch (e) {
          setSyncStatus({ phase: "err", at: Date.now(), rev: syncRevRef.current, err: friendlySyncErr(e) });
        } finally {
          syncBusyRef.current = false;
          retryPendingPush();
        }
      }

      function schedulePush() {
        if (syncPushTimerRef.current) clearTimeout(syncPushTimerRef.current);
        syncPushTimerRef.current = setTimeout(() => {
          syncPushTimerRef.current = null;
          const json = syncCanonicalJson();
          if (syncLastJsonRef.current !== null && json !== syncLastJsonRef.current) {
            doPush(json, syncRevRef.current);
          }
        }, SYNC_PUSH_DEBOUNCE_MS);
      }

      async function syncPull(opts = {}) {
        if (!syncEnabledRef.current || syncBusyRef.current) return;
        syncBusyRef.current = true;
        setSyncStatus(s => ({ ...s, phase: "syncing" }));
        try {
          const res = await syncFetch(syncEndpoint(), {
            headers: { "X-Sync-Token": localStorage.getItem(SYNC_TOKEN_KEY) || "" },
          });
          if (res.status === 401) throw new Error("同步口令不对");
          if (!res.ok) throw new Error("服务返回 " + res.status);
          const data = await res.json();
          syncReadyRef.current = true;
          const rev = data.rev || 0;
          // 记下「云端这份数据是谁在什么时候推的」，并在面板上标出来
          touchSyncMeta({ checkedAt: Date.now(), fromDevice: data.device || null, fromAt: data.updatedAt || null });
          const localJson = syncCanonicalJson();
          const hadSyncedBefore = !!readJSON(SYNC_STATE_KEY, null);
          const localEmpty = !hadSyncedBefore && (buildSyncPayload().accounts || []).length === 0;

          if (!data.payload) {
            // 云端还是空的：本机有数据就推上去（首次启用的上传）；
            // 空设备不推，避免把「空快照」推成第 1 版，给真正有数据的设备制造假冲突
            syncRevRef.current = 0;
            const localAccs = buildSyncPayload().accounts || [];
            if (localAccs.length > 0) {
              await doPush(localJson, 0);
            } else {
              setSyncStatus({ phase: "ok", at: Date.now(), rev: 0, err: null });
            }
            return;
          }

          if (rev === syncRevRef.current) {
            // 云端没变：本机若有未同步改动就补推（跨页面重开 / 推送失败后的自愈）
            if (localJson !== syncLastJsonRef.current) {
              schedulePush();
            } else {
              setSyncStatus({ phase: "ok", at: Date.now(), rev, err: null });
            }
            return;
          }

          if (rev < syncRevRef.current) {
            setSyncStatus({ phase: "err", at: Date.now(), rev: syncRevRef.current, err: "云端版本异常，已跳过" });
            return;
          }

          // 云端有新版本
          if (localEmpty) {
            // 从没同步过的空设备：直接采纳云端
            adoptRemote(data.payload, rev);
            return;
          }

          const remoteJson = JSON.stringify(data.payload);
          if (remoteJson === localJson) {
            // 内容其实一致：只认版本号
            syncRevRef.current = rev;
            syncLastJsonRef.current = localJson;
            touchSyncMeta({ pulledAt: Date.now() });
            persistSyncState(rev, localJson);
            setSyncStatus({ phase: "ok", at: Date.now(), rev, err: null });
            return;
          }

          if (syncLastJsonRef.current !== null && localJson !== syncLastJsonRef.current) {
            // 本机有未同步改动 + 云端有更新 → 冲突，让用户选
            if (!opts.force && syncDismissedRevRef.current === rev) {
              setSyncStatus({ phase: "ok", at: Date.now(), rev, err: null });
              return;
            }
            setConflictState({ rev, updatedAt: data.updatedAt || null, device: data.device || null, payload: data.payload });
            setSyncStatus({ phase: "conflict", at: Date.now(), rev, err: null });
            return;
          }

          // 本机没有未同步改动：直接采纳云端
          adoptRemote(data.payload, rev);
        } catch (e) {
          setSyncStatus({ phase: "err", at: Date.now(), rev: syncRevRef.current, err: friendlySyncErr(e) });
        } finally {
          syncBusyRef.current = false;
          retryPendingPush();
        }
      }

      // 轻量心跳：只问「云端版本号变了没」，变了才拉全量。
      // 每 20 秒一次、约 80 字节，不用为了省流量把刷新间隔拉到几分钟。
      // 心跳失败不刷错误状态（避免每 20 秒弹一次红字），由下一次全量拉取或手动同步报错。
      async function syncHeartbeat() {
        if (!syncEnabledRef.current || syncBusyRef.current) return;
        try {
          const res = await syncFetch(syncEndpoint() + "?meta=1", {
            headers: { "X-Sync-Token": localStorage.getItem(SYNC_TOKEN_KEY) || "" },
          });
          if (!res.ok) return;
          const m = await res.json();
          const rev = m.rev || 0;
          touchSyncMeta({ checkedAt: Date.now(), fromDevice: m.device || null, fromAt: m.updatedAt || null });
          if (rev !== syncRevRef.current) {
            syncPull();
            return;
          }
          // 版本没变但本机有没推上去的改动 → 补推（推送失败后的自愈）
          if (syncLastJsonRef.current !== null && syncCanonicalJson() !== syncLastJsonRef.current) {
            schedulePush();
          }
        } catch (e) { /* 心跳静默失败 */ }
      }

      // 手动「从云端刷新」：不看本机改动，直接用云端数据覆盖本机（覆盖前先把本机存一份快照）
      async function forcePullFromCloud() {
        if (!syncEnabledRef.current || syncBusyRef.current) return;
        syncBusyRef.current = true;
        setSyncStatus(s => ({ ...s, phase: "syncing" }));
        try {
          const res = await syncFetch(syncEndpoint(), {
            headers: { "X-Sync-Token": localStorage.getItem(SYNC_TOKEN_KEY) || "" },
          });
          if (res.status === 401) throw new Error("同步口令不对");
          if (!res.ok) throw new Error("服务返回 " + res.status);
          const data = await res.json();
          if (!data.payload) {
            setSyncStatus({ phase: "ok", at: Date.now(), rev: 0, err: null });
            setBackupMsg({ type: "err", text: "云端还没有数据，先在数据完整的设备上启用同步上传一次。" });
            return;
          }
          const cur = localStorage.getItem(STORAGE_KEY);
          if (cur && (readJSON(STORAGE_KEY, []) || []).length > 0) { pushSnapshot(cur); loadSnapshots(); }
          touchSyncMeta({ checkedAt: Date.now(), fromDevice: data.device || null, fromAt: data.updatedAt || null });
          syncDismissedRevRef.current = 0;
          adoptRemote(data.payload, data.rev || 0);
          setConflictState(null);
          setBackupMsg({ type: "ok", text: "已用云端数据刷新本机（刷新前的本机数据留了一份在下面的自动快照里）。" });
        } catch (e) {
          setSyncStatus({ phase: "err", at: Date.now(), rev: syncRevRef.current, err: friendlySyncErr(e) });
        } finally {
          syncBusyRef.current = false;
          retryPendingPush();
        }
      }

      // 冲突：用本机覆盖云端（带着云端当前版本号强推）
      async function resolveConflictKeepLocal() {
        const c = syncConflict;
        if (!c) return;
        setConflictState(null);
        syncDismissedRevRef.current = 0;
        await doPush(syncCanonicalJson(), c.rev);
      }

      // 冲突：用云端覆盖本机（本机改动先自动快照一份，可从备份面板找回）
      function resolveConflictUseRemote() {
        const c = syncConflict;
        if (!c) return;
        setConflictState(null);
        syncDismissedRevRef.current = 0;
        const cur = localStorage.getItem(STORAGE_KEY);
        if (cur) { pushSnapshot(cur); loadSnapshots(); }
        adoptRemote(c.payload, c.rev);
        setBackupMsg({ type: "ok", text: "已采用云端数据覆盖本机（覆盖前的本机数据留了一份在自动快照里）。" });
      }

      function dismissConflict() {
        const c = syncConflict;
        if (c) syncDismissedRevRef.current = c.rev;
        setConflictState(null);
        setSyncStatus(s => ({ ...s, phase: "ok", at: Date.now(), rev: syncRevRef.current, err: null }));
      }

      // 手动「立即同步」：先拉后推；冲突时弹窗（手动操作不受「稍后」抑制）
      async function manualSyncNow() {
        await syncPull({ force: true });
        if (syncConflictRef.current) return; // 冲突已弹窗，等用户选择，不要拿旧版本号盲推
        if (!syncEnabledRef.current || syncBusyRef.current) return;
        const json = syncCanonicalJson();
        if (syncLastJsonRef.current !== null && json !== syncLastJsonRef.current) {
          await doPush(json, syncRevRef.current);
        }
      }

      // 手动「上传本机」：不看云端内容，直接覆盖
      async function forceUploadNow() {
        if (!syncEnabledRef.current || syncBusyRef.current) return;
        syncBusyRef.current = true;
        setSyncStatus(s => ({ ...s, phase: "syncing" }));
        try {
          const res = await syncFetch(syncEndpoint(), {
            headers: { "X-Sync-Token": localStorage.getItem(SYNC_TOKEN_KEY) || "" },
          });
          if (res.status === 401) throw new Error("同步口令不对");
          if (!res.ok) throw new Error("服务返回 " + res.status);
          const data = await res.json();
          syncReadyRef.current = true;
          syncBusyRef.current = false;
          await doPush(syncCanonicalJson(), data.rev || 0);
          return;
        } catch (e) {
          syncBusyRef.current = false;
          setSyncStatus({ phase: "err", at: Date.now(), rev: syncRevRef.current, err: friendlySyncErr(e) });
        }
      }

      function saveSyncConfig() {
        const url = syncUrl.trim().replace(/\/+$/, "");
        const token = syncToken.trim();
        if (!/^https:\/\//.test(url)) {
          setBackupMsg({ type: "err", text: "同步地址要以 https:// 开头（Worker 的域名）。" });
          return;
        }
        if (!token) {
          setBackupMsg({ type: "err", text: "请填写同步口令（和 Worker 里设置的 SYNC_TOKEN 一致）。" });
          return;
        }
        const dev = syncDevice.trim() || ("设备-" + uid().slice(0, 4));
        localStorage.setItem(SYNC_URL_KEY, url);
        localStorage.setItem(SYNC_TOKEN_KEY, token);
        localStorage.setItem(SYNC_DEVICE_KEY, dev);
        localStorage.setItem(SYNC_ON_KEY, "1");
        setSyncDevice(dev);
        setSyncOn(true);
        setBackupMsg({ type: "ok", text: "云同步已启用，正在连接云端…" });
      }

      function disableSync() {
        localStorage.setItem(SYNC_ON_KEY, "0");
        setSyncOn(false);
        setBackupMsg({ type: "ok", text: "云同步已停用（配置保留，随时可重新启用）。" });
      }

      // 首次把当前内容记为「与云端对齐的基线」；之后内容再变才算有未同步改动
      useEffect(() => {
        if (!loaded) return;
        const json = syncCanonicalJson();
        if (syncLastJsonRef.current === null) {
          const saved = readJSON(SYNC_STATE_KEY, null);
          syncLastJsonRef.current = saved && typeof saved.json === "string" ? saved.json : json;
          syncRevRef.current = saved && typeof saved.rev === "number" ? saved.rev : 0;
          if (saved && saved.meta && typeof saved.meta === "object") {
            syncMetaRef.current = { ...syncMetaRef.current, ...saved.meta };
            setSyncMeta(syncMetaRef.current);
          }
          return;
        }
        if (!syncEnabledRef.current) return;
        if (json === syncLastJsonRef.current) return;
        schedulePush();
      }, [loaded, accounts, collectionGoals, todayRevived, revivedTodayIds, revivedTodayBatchIds, lowPriorityKinds]);

      // 同步生命周期：启用即拉取；之后 20 秒一次轻量心跳（版本变了才拉全量），
      // 另有 3 分钟一次的全量兜底；切前台探一次、切后台/关页面前把没推的改动推上去。
      useEffect(() => {
        syncEnabledRef.current = syncOn;
        if (!syncOn) return undefined;
        syncPull();
        const hb = setInterval(() => {
          if (document.visibilityState === "hidden") return;
          syncHeartbeat();
        }, SYNC_HEARTBEAT_MS);
        const full = setInterval(() => {
          if (document.visibilityState === "hidden") return;
          syncPull();
        }, SYNC_POLL_MS);
        const pushIfDirty = () => {
          const json = syncCanonicalJson();
          if (syncLastJsonRef.current !== null && json !== syncLastJsonRef.current) {
            doPush(json, syncRevRef.current);
          }
        };
        const onVis = () => {
          if (document.visibilityState === "visible") {
            syncHeartbeat();
          } else {
            pushIfDirty();
          }
        };
        document.addEventListener("visibilitychange", onVis);
        window.addEventListener("pagehide", pushIfDirty);
        document.addEventListener("freeze", pushIfDirty);
        return () => {
          clearInterval(hb);
          clearInterval(full);
          document.removeEventListener("visibilitychange", onVis);
          window.removeEventListener("pagehide", pushIfDirty);
          document.removeEventListener("freeze", pushIfDirty);
        };
      }, [syncOn]);

      // 渲染期算一次「是否有未同步改动」，给面板状态行用
      const syncUnsynced = syncOn && syncLastJsonRef.current !== null && syncCanonicalJson() !== syncLastJsonRef.current;

      // ========== 日历辅助函数 ==========
      function getWiltDate(ts, durationMs) {
        const wiltTime = ts + durationMs;
        const d = new Date(wiltTime);
        d.setHours(0, 0, 0, 0);
        return d.getTime();
      }

      function getTodayStart() {
        const d = new Date();
        d.setHours(0, 0, 0, 0);
        return d.getTime();
      }

      function getDateKey(ts) {
        const d = new Date(ts);
        return `${d.getMonth() + 1}月${d.getDate()}日`;
      }

      function getDayLabel(ts, index) {
        if (index === 0) return "今天";
        if (index === 1) return "明天";
        const d = new Date(ts);
        return `${d.getMonth() + 1}/${d.getDate()}`;
      }

      function getCalendarData(searchQuery = "") {
        const data = {};
        const todayStart = getTodayStart();
        const todayEnd = todayStart + 86400000;
        const query = searchQuery.trim();

        // 判断搜索类型
        const isAccountSearch = /^\d+$/.test(query);     // 纯数字 → 按账号ID过滤
        const isCollapsedSearch = query === "//";        // // → 按折叠账号过滤
        const isFlowerSearch = query && !isAccountSearch && !isCollapsedSearch; // 其他 → 按花名过滤

        // 过滤函数：判断一朵花是否应该被统计
        const shouldIncludeFlower = (account, flower) => {
          if (!query) return true; // 无搜索，全部包含

          if (isCollapsedSearch) {
            // 只统计折叠账号的花
            return collapsedAccounts.has(account.accountId);
          }

          if (isAccountSearch) {
            // 按账号ID过滤：只包含匹配账号的所有花
            return account.accountId.includes(query);
          }

          // 按花名过滤：只包含匹配花名的花
          return flower.name.toLowerCase().includes(query.toLowerCase());
        };

        // 过滤函数：判断账号是否应该被统计（用于 revived 统计，因为 revived 没有 flower 信息）
        const shouldIncludeAccount = (account) => {
          if (!query) return true;
          if (isCollapsedSearch) return collapsedAccounts.has(account.accountId);
          if (isAccountSearch) return account.accountId.includes(query);
          return true; // 花名搜索时，账号级别的 revived 需要遍历所有账号找匹配的花
        };

        for (let i = 0; i < 14; i++) {
          data[todayStart + i * 86400000] = {
            count: 0,
            revived: 0,
            pending: 0,
            wiltToday: 0,   // 今天 00:00–24:00 内枯萎、还没复活的棵数（含今天稍后才会枯的）
            wiltTodayTotal: 0, // 今日枯萎总数（含今天已复活的），不随复活减少
            backlog: 0,     // 今天之前就枯萎、一直没复活的积压棵数
            flowers: []
          };
        }

        // 先统计今天已复活的花（从 revivedTodayIds，键为 stableFlowerKey：accountId|花名）
        accounts.forEach(a => {
          if (!shouldIncludeAccount(a)) return;
          a.flowers.forEach(f => {
            const key = stableFlowerKey(a.accountId, f.name);
            if (revivedTodayIds.has(key) && shouldIncludeFlower(a, f)) {
              data[todayStart].revived += f.count;
              // 这朵是今天枯萎的、今天又被复活了 —— 它仍然算在今天枯萎总数里
              if (revivedTodayBatchIds.has(key)) data[todayStart].wiltTodayTotal += f.count;
            }
          });
        });

        // 再统计今天待处理的花（当前状态是已过期或今天枯萎）
        accounts.forEach(a => {
          a.flowers.forEach(f => {
            if (!shouldIncludeFlower(a, f)) return;
            if (f.revivalTime === null) return; // 未记录不算

            const rem = remMs(f);
            if (rem === null) return;

            const wiltTime = f.revivalTime + f.durationMs;
            const isExpired = rem <= 0; // 已枯萎
            const isTodayWilt = wiltTime >= todayStart && wiltTime < todayEnd; // 今天内枯萎

            // 只统计未复活的（键与写入端一致：stableFlowerKey）
            if (!revivedTodayIds.has(stableFlowerKey(a.accountId, f.name)) && (isExpired || isTodayWilt)) {
              data[todayStart].pending += f.count;
              data[todayStart].flowers.push(f);
              // 切分：今日枯萎（枯萎时刻落在今天 00:00–24:00）/ 更早积压（今天之前就枯的）
              if (isTodayWilt) {
                data[todayStart].wiltToday += f.count;
                data[todayStart].wiltTodayTotal += f.count;
              }
              else data[todayStart].backlog += f.count;
            }
          });
        });

        data[todayStart].count = data[todayStart].revived + data[todayStart].pending;

        // 明天及未来
        accounts.forEach(a => {
          a.flowers.forEach(f => {
            if (!shouldIncludeFlower(a, f)) return;
            if (f.revivalTime === null) return;
            const rem = remMs(f);
            if (rem === null) return;

            const wiltTime = f.revivalTime + f.durationMs;
            if (rem <= 0) return; // 已枯萎的已处理
            if (wiltTime >= todayStart && wiltTime < todayEnd) return; // 今天枯萎的已处理

            const wiltDate = getWiltDate(f.revivalTime, f.durationMs);
            const dayIndex = Math.floor((wiltDate - todayStart) / 86400000);

            if (dayIndex >= 1 && dayIndex < 14) {
              const key = todayStart + dayIndex * 86400000;
              if (data[key]) {
                data[key].count += f.count;
              }
            }
          });
        });

        return Object.entries(data).map(([timestamp, info]) => ({
          timestamp: parseInt(timestamp),
          ...info,
        }));
      }

      // ========== 收集进度相关函数 ==========

      // 计算某花在「未来 14 天窗口」内的枯萎总数（所有账号）
      // 窗口为 [今天, 今天+14 天]，即包含第 14 天这一格 —— 见下方边界说明
      // 单色花按100%计算，双色花按50%计算，昙花14天内会枯萎7轮所以乘7
      function getFlowerWiltCount14Days(flowerName) {
        const todayStart = getTodayStart();
        let singleColorCount = 0;   // 单色花数量
        let dualColorCount = 0;     // 双色花数量（目标包含该珍稀花的）

        accounts.forEach(a => {
          a.flowers.forEach(f => {
            if (f.revivalTime === null) return;
            const rem = remMs(f);
            if (rem === null) return;

            // 统计窗口内的枯萎（含已枯萎的）
            // 边界必须取 dayIndex <= 14（含第 14 天这一格）：
            // 默认存活时长 336h 正好是 14 天，刚复活的花枯萎日恰好落在第 14 格，
            // 若按 dayIndex >= 14 排除，它就会从分母里消失，
            // 造成「复活后进度增加、预计天数反而变长」的假象。
            const wiltDate = getWiltDate(f.revivalTime, f.durationMs);
            const dayIndex = Math.floor((wiltDate - todayStart) / 86400000);
            if (dayIndex < 0 || dayIndex > 14) return;

            const normalizedName = f.name.replace(/^\d+/, ""); // 去掉前缀数字

            // 判断是单色还是双色
            const rareTargets = getRareTargetsFromDual(f.name);

            if (rareTargets.length === 0) {
              // 单色花：直接匹配花名
              if (normalizedName.includes(flowerName)) {
                singleColorCount += f.count;
              }
            } else {
              // 双色花：检查目标是否包含当前统计的珍稀花
              if (rareTargets.includes(flowerName)) {
                dualColorCount += f.count;
              }
            }
          });
        });

        // 单色花100% + 双色花50%
        const effectiveCount = singleColorCount + dualColorCount * 0.5;

        // 昙花特殊处理：48小时周期，14天内会枯萎7轮
        const isEphemeral = flowerName.includes('昙花');
        const multiplier = isEphemeral ? 7 : 1;

        return effectiveCount * multiplier;
      }

      // 计算预计完成天数
      // 注意：getFlowerWiltCount14Days 已经考虑了昙花的7倍乘数
      // 所以这里直接除以14就是每天平均可获得数量
      //
      // 日均要按每日额度封顶：供给再多，一天也只有前 DAILY_QUOTA 株复活会奖励花，
      // 超出的只能顺延到第二天。供给不超额度时封顶不生效（不误伤正常情况）；
      // 供给饱和时吞吐恒定在 DAILY_QUOTA/天，「剩余 ÷ DAILY_QUOTA」正好是精确解。
      function getEstimatedDays(flowerName, needed, owned) {
        const remaining = needed - owned;
        if (remaining <= 0) return 0;
        const effectiveCount14 = getFlowerWiltCount14Days(flowerName);
        if (effectiveCount14 <= 0) return null; // 无法计算
        const rawPerDay = effectiveCount14 / 14;
        const perDay = Math.min(rawPerDay, DAILY_QUOTA);
        const days = remaining / perDay;
        return Math.ceil(days);
      }

      // 统计账号中某花的实际数量（单色+双色），只统计有枯萎时间记录的花
      // 返回 { single: 单色数量, dual: 双色数量 }
      function getAccountFlowerStats(flowerName) {
        let single = 0;
        let dual = 0;
        // 规范化目标花名：去掉"花"字后缀，用于模糊匹配
        const normalizedTarget = flowerName.replace(/花$/, "");
        accounts.forEach(a => {
          a.flowers.forEach(f => {
            // 只统计有枯萎时间记录的花
            if (f.revivalTime === null) return;
            const normalizedName = f.name.replace(/^\d+/, "");
            const rareTargets = getRareTargetsFromDual(f.name);
            if (rareTargets.length === 0) {
              // 单色花：去掉"花"字后模糊匹配
              const nameWithoutFlower = normalizedName.replace(/花$/, "");
              if (nameWithoutFlower === normalizedTarget) {
                single += f.count;
              }
            } else {
              // 双色花：目标包含该珍稀花（也做模糊匹配）
              const matched = rareTargets.some(target => {
                const targetWithoutFlower = target.replace(/花$/, "");
                return targetWithoutFlower === normalizedTarget;
              });
              if (matched) {
                dual += f.count;
              }
            }
          });
        });
        return { single, dual };
      }

      // 更新收集进度的 owned（复活时调用）
      function addToCollection(flowerName, count) {
        setCollectionGoals(prev => {
          const current = prev[flowerName] || { needed: 0, owned: 0 };
          return {
            ...prev,
            [flowerName]: {
              ...current,
              owned: current.owned + count,
            },
          };
        });
      }

      // 设置收集目标
      function setCollectionGoal(flowerName, needed, owned) {
        setCollectionGoals(prev => ({
          ...prev,
          [flowerName]: { needed, owned },
        }));
      }

      // 删除收集目标
      function removeCollectionGoal(flowerName) {
        setCollectionGoals(prev => {
          const next = { ...prev };
          delete next[flowerName];
          return next;
        });
      }

      // ========== 【调试】暴露 accounts 到 window，方便 Console 调试 ==========
      useEffect(() => {
        window.__debugAccounts = accounts;
      }, [accounts]);

      // ========== 今日复活计数 ==========
      function incrementTodayRevived() {
        setTodayRevived(prev => {
          const newCount = prev + 1;
          localStorage.setItem(TODAY_KEY, JSON.stringify({
            date: new Date().toDateString(),
            count: newCount,
          }));
          return newCount;
        });
      }

      function saveFlowerRename(accountId, flowerId) {
        markEdited(accountId);
        if (!editingFlower || !editingFlower.text.trim()) {
          setEditingFlower(null);
          return;
        }
        const text = editingFlower.text.trim();
        const m = text.match(/^(.+?)(\d+)$/);
        if (!m) {
          setEditingFlower(null);
          return;
        }
        const newName = m[1];
        const newCount = parseInt(m[2]);
        setAccounts(prev => prev.map(a =>
          a.accountId !== accountId ? a
            : { ...a, flowers: a.flowers.map(f => f.id === flowerId ? { ...f, name: newName, count: newCount } : f) }
        ));
        setEditingFlower(null);
      }

      function saveAccountRename(oldAccountId) {
        if (!editingFlower || !editingFlower.text.trim()) {
          setEditingFlower(null);
          return;
        }
        const newAccountId = editingFlower.text.trim();
        if (!newAccountId || newAccountId === oldAccountId) {
          setEditingFlower(null);
          return;
        }
        // 检查是否已存在
        if (accounts.some(a => a.accountId === newAccountId && a.accountId !== oldAccountId)) {
          alert("该账号ID已存在！");
          setEditingFlower(null);
          return;
        }
        setAccounts(prev => prev.map(a =>
          a.accountId !== oldAccountId ? a : { ...a, accountId: newAccountId }
        ));

        // 改账号 ID 也算「修改过」：胶囊里若存着旧 ID 要同步换名，否则点进去找不到元素
        setRecentEdited(prev => prev.map(r => (r.accountId === oldAccountId ? { ...r, accountId: newAccountId } : r)));
        markEdited(newAccountId);

        // 同步迁移以 accountId 为键的附属数据，否则提醒 / 折叠 / 置顶会静默失效
        setAccountReminders(prev => {
          const next = new Set(prev);
          if (next.delete(oldAccountId)) next.add(newAccountId);
          writeJSON(REMINDER_KEY, Array.from(next));
          return next;
        });
        setCollapsedAccounts(prev => {
          const next = new Set(prev);
          if (next.delete(oldAccountId)) next.add(newAccountId);
          return next;
        });
        if (pinnedAccountId === oldAccountId) setPinnedAccountId(newAccountId);
        if (window.__reminderState?.[oldAccountId]) {
          window.__reminderState[newAccountId] = window.__reminderState[oldAccountId];
          delete window.__reminderState[oldAccountId];
        }

        setEditingFlower(null);
      }

      // ========== 【修改】doImport 使用新的 parseInput ==========
      function doImport() {
        // 格式1：旧格式（无剩余时长，自动检测 # 号），格式2：带剩余时长，无需 # 号
        const format1Result = importText.trim() ? parseInput(importText) : [];
        const format2Result = importText2.trim() ? parseInput(importText2, true) : [];

        // 合并两种格式的结果
        const allParsed = [...format1Result, ...format2Result];

        if (allParsed.length === 0) {
          setImportError("没有可导入的数据，请检查输入格式\n格式1：花名+数量 账号ID\n格式2：花名+数量 小时 分钟，账号ID单独一行");
          return;
        }

        setAccounts(prev => {
          const next = [...prev];
          for (const p of allParsed) {
            const idx = next.findIndex(a => a.accountId === p.accountId);
            if (idx === -1) next.push(p);
            else {
              const merged = [...next[idx].flowers];
              for (const f of p.flowers) {
                if (!merged.find(mf => mf.name === f.name)) merged.push(f);
              }
              next[idx] = { ...next[idx], flowers: merged };
            }
          }
          return next;
        });

        // 清理提醒：只保留当前存在的账号
        setAccountReminders(prev => {
          const currentIds = new Set(accounts.map(a => a.accountId));
          allParsed.forEach(p => currentIds.add(p.accountId));
          const newSet = new Set([...prev].filter(id => currentIds.has(id)));
          localStorage.setItem(REMINDER_KEY, JSON.stringify(Array.from(newSet)));
          return newSet;
        });

        setImportText(""); setImportText2(""); setImportError(""); setShowImport(false);
      }

      // ========== 今日枯萎批次的记账 ==========
      // 「今日枯萎总数」= 未复活且今天枯的 + 今天已复活但复活前就在今天枯萎的。
      // 后面这一半必须在复活前算，因为复活会把 revivalTime 改成 now，原枯萎时刻随之丢失。
      function isTodayBatchFlower(f) {
        if (!f || f.revivalTime === null) return false;
        const wiltTime = f.revivalTime + f.durationMs;
        const start = getTodayStart();
        return wiltTime >= start && wiltTime < start + 86400000;
      }

      function persistRevivedToday(nextIds, nextBatchIds) {
        localStorage.setItem(TODAY_IDS_KEY, JSON.stringify({
          date: new Date().toDateString(),
          ids: Array.from(nextIds),
          todayWiltIds: Array.from(nextBatchIds || []),
        }));
      }

      // 记下今天复活了哪些花（ids）以及其中哪些原本属于今日批次（batchIds）
      function commitRevivedToday(addKeys, addBatchKeys) {
        const nextIds = new Set(revivedTodayIds);
        (addKeys || []).forEach(k => nextIds.add(k));
        const nextBatch = new Set(revivedTodayBatchIds);
        (addBatchKeys || []).forEach(k => nextBatch.add(k));
        setRevivedTodayIds(nextIds);
        setRevivedTodayBatchIds(nextBatch);
        persistRevivedToday(nextIds, nextBatch);
      }

      function reviveOne(accountId, flowerId) {
        markEdited(accountId);
        const now = Date.now();
        const account = accounts.find(a => a.accountId === accountId);
        const flower = account ? account.flowers.find(fl => fl.id === flowerId) : null;
        const addCount = flower ? flower.count : 0;
        // 用「账号ID|花名」做今日去重键，uid 在导入备份后会重新生成
        const todayKey = flower ? stableFlowerKey(accountId, flower.name) : null;
        // 复活前它是不是「今天枯萎的」——复活会覆盖 revivalTime，所以先判断
        const todayBatchKeys = (todayKey && isTodayBatchFlower(flower)) ? [todayKey] : [];

        // 检查是否是双色花
        const rareTargets = flower ? getRareTargetsFromDual(flower.name) : [];
        if (rareTargets.length > 0) {
          // 双色花：弹出分配弹窗
          setDualColorModal({
            mode: 'single',
            flowerName: flower.name,
            count: addCount,
            targets: rareTargets,
            allocations: rareTargets.map(() => 0),
            onConfirm: (allocations) => {
              // 用户确认后执行复活
              setAccounts(prev => prev.map(a =>
                a.accountId !== accountId ? a
                  : { ...a, flowers: a.flowers.map(fl => fl.id === flowerId ? { ...fl, revivalTime: now, durationMs: fl.name.includes('昙花') ? EPHEMERAL_MS : DEFAULT_MS } : fl) }
              ));

              if (addCount > 0 && todayKey && !revivedTodayIds.has(todayKey)) {
                setTodayRevived(prev => {
                  const newCount = prev + addCount;
                  localStorage.setItem(TODAY_KEY, JSON.stringify({
                    date: new Date().toDateString(),
                    count: newCount,
                  }));
                  return newCount;
                });

                commitRevivedToday([todayKey], todayBatchKeys);

                // 更新收集进度
                allocations.forEach((count, idx) => {
                  if (count > 0) {
                    addToCollection(rareTargets[idx], count);
                  }
                });
              }
              setDualColorModal(null);
            },
          });
          return;
        }

        // 单色花：直接复活
        setAccounts(prev => prev.map(a =>
          a.accountId !== accountId ? a
            : { ...a, flowers: a.flowers.map(fl => fl.id === flowerId ? { ...fl, revivalTime: now, durationMs: fl.name.includes('昙花') ? EPHEMERAL_MS : DEFAULT_MS } : fl) }
        ));

        if (addCount > 0 && todayKey && !revivedTodayIds.has(todayKey)) {
          setTodayRevived(prev => {
            const newCount = prev + addCount;
            localStorage.setItem(TODAY_KEY, JSON.stringify({
              date: new Date().toDateString(),
              count: newCount,
            }));
            return newCount;
          });

          commitRevivedToday([todayKey], todayBatchKeys);

          // 更新收集进度（如果该花在珍稀列表中）
          // 使用规范化花名（去掉前缀数字）匹配和存储
          const normalizedFlowerName = flower.name.replace(/^\d+/, "");
          if (flower && RARE_FLOWERS.includes(normalizedFlowerName)) {
            addToCollection(normalizedFlowerName, addCount);
          }
        }
      }

      function reviveAll(accountId) {
        markEdited(accountId);
        const now = Date.now();
        const account = accounts.find(a => a.accountId === accountId);
        const allFlowers = account ? account.flowers : [];
        const newRevived = allFlowers.filter(f => !revivedTodayIds.has(stableFlowerKey(accountId, f.name)));
        // 这一批里原本属于「今天枯萎批次」的花（复活前算，复活后信息就没了）
        const newRevivedBatchKeys = newRevived
          .filter(f => isTodayBatchFlower(f))
          .map(f => stableFlowerKey(accountId, f.name));

        // 分离单色花和双色花
        const singleColorFlowers = [];
        const dualColorFlowers = [];
        newRevived.forEach(f => {
          const rareTargets = getRareTargetsFromDual(f.name);
          if (rareTargets.length > 0) {
            dualColorFlowers.push({ ...f, rareTargets });
          } else {
            singleColorFlowers.push(f);
          }
        });

        // 如果有双色花，弹出汇总分配弹窗
        if (dualColorFlowers.length > 0) {
          setDualColorModal({
            mode: 'batch',
            flowers: dualColorFlowers,
            allocations: dualColorFlowers.map(f => f.rareTargets.map(() => 0)),
            singleColorFlowers: singleColorFlowers,
            accountId: accountId,
            onConfirm: (allAllocations) => {
              // 确认后执行所有复活
              setAccounts(prev => prev.map(a =>
                a.accountId !== accountId ? a
                  : { ...a, flowers: a.flowers.map(f => ({ ...f, revivalTime: now, durationMs: f.name.includes('昙花') ? EPHEMERAL_MS : DEFAULT_MS })) }
              ));

              const totalAddCount = newRevived.reduce((sum, f) => sum + f.count, 0);
              if (totalAddCount > 0) {
                setTodayRevived(prev => {
                  const newCount = prev + totalAddCount;
                  localStorage.setItem(TODAY_KEY, JSON.stringify({ date: new Date().toDateString(), count: newCount }));
                  return newCount;
                });
                commitRevivedToday(
                  newRevived.map(f => stableFlowerKey(accountId, f.name)),
                  newRevivedBatchKeys
                );

                // 更新单色花的收集进度
                singleColorFlowers.forEach(f => {
                  const normalizedName = f.name.replace(/^\d+/, "");
                  if (RARE_FLOWERS.includes(normalizedName)) {
                    addToCollection(normalizedName, f.count);
                  }
                });

                // 更新双色花的收集进度
                allAllocations.forEach(({ targets, allocations }) => {
                  allocations.forEach((count, idx) => {
                    if (count > 0) {
                      addToCollection(targets[idx], count);
                    }
                  });
                });
              }
              setDualColorModal(null);
            },
          });
          return;
        }

        // 只有单色花：直接复活
        const addCount = newRevived.reduce((sum, f) => sum + f.count, 0);

        setAccounts(prev => prev.map(a =>
          a.accountId !== accountId ? a
            : { ...a, flowers: a.flowers.map(f => ({ ...f, revivalTime: now, durationMs: f.name.includes('昙花') ? EPHEMERAL_MS : DEFAULT_MS })) }
        ));

        if (addCount > 0) {
          setTodayRevived(prev => {
            const newCount = prev + addCount;
            localStorage.setItem(TODAY_KEY, JSON.stringify({ date: new Date().toDateString(), count: newCount }));
            return newCount;
          });
          commitRevivedToday(
            newRevived.map(f => stableFlowerKey(accountId, f.name)),
            newRevivedBatchKeys
          );

          // 更新收集进度
          singleColorFlowers.forEach(f => {
            const normalizedName = f.name.replace(/^\d+/, "");
            if (RARE_FLOWERS.includes(normalizedName)) {
              addToCollection(normalizedName, f.count);
            }
          });
        }
      }

      // ========== 【修改】打开设置弹窗时置顶该账号 ==========
      function openModal(accountId, flowerId, f) {
        const totalDurationMs = f.name.includes('昙花') ? EPHEMERAL_MS : DEFAULT_MS;
        let revivalTimeStr, hours;

        if (f.revivalTime !== null) {
          revivalTimeStr = toDatetimeLocal(f.revivalTime);
          const remainingHours = calcRemainingFromRevivalTime(f.revivalTime, totalDurationMs);
          hours = String(Math.max(0, Math.round(remainingHours * 10) / 10));
        } else {
          revivalTimeStr = toDatetimeLocal(Date.now());
          hours = String(Math.round(totalDurationMs / 3600000));
        }

        setModal({
          accountId, flowerId,
          hours,
          revivalTimeStr,
          totalDurationMs,
        });

        // 【新增】置顶该账号
        setPinnedAccountId(accountId);
      }

      function saveModal() {
        // 解析 hours（支持 "3.5" 或 "3 30"）
        let totalHours = null;
        const inputValue = modal.hours;

        if (inputValue.includes(' ')) {
          const parts = inputValue.trim().split(/\s+/);
          if (parts.length === 2) {
            const hours = parseFloat(parts[0]);
            const minutes = parseFloat(parts[1]);
            if (!isNaN(hours) && !isNaN(minutes)) {
              totalHours = hours + (minutes / 60);
            }
          }
        } else {
          totalHours = parseFloat(inputValue);
        }

        if (isNaN(totalHours) || totalHours < 0) return;

        const rt = modal.revivalTimeStr ? new Date(modal.revivalTimeStr).getTime() : null;
        markEdited(modal.accountId);
        setAccounts(prev => prev.map(a =>
          a.accountId !== modal.accountId ? a : {
            ...a,
            flowers: a.flowers.map(f =>
              f.id !== modal.flowerId ? f
                : { ...f, durationMs: modal.totalDurationMs, revivalTime: isNaN(rt) ? f.revivalTime : rt }
            ),
          }
        ));
        setModal(null);
      }

      function deleteAccount(id) {
        setAccounts(prev => prev.filter(a => a.accountId !== id));
        // 同步清理该账号的提醒记录
        setAccountReminders(prev => {
          const newSet = new Set(prev);
          newSet.delete(id);
          writeJSON(REMINDER_KEY, Array.from(newSet));
          // 同步清理状态记录
          if (window.__reminderState?.[id]) {
            delete window.__reminderState[id];
          }
          return newSet;
        });
        // 同步清理折叠与置顶记录
        setCollapsedAccounts(prev => {
          if (!prev.has(id)) return prev;
          const next = new Set(prev);
          next.delete(id);
          return next;
        });
        if (pinnedAccountId === id) setPinnedAccountId(null);
        setConfirmDel(null);
      }

      function deleteFlower(accountId, flowerId) {
        markEdited(accountId);
        setAccounts(prev => prev.map(a =>
          a.accountId !== accountId ? a
            : { ...a, flowers: a.flowers.filter(f => f.id !== flowerId) }
        ));
      }

      async function copyText(text, id) {
        try {
          await navigator.clipboard.writeText(text);
          setCopiedId(id);
          setTimeout(() => setCopiedId(null), 1500);
        } catch {
          const ta = document.createElement("textarea");
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);
          setCopiedId(id);
          setTimeout(() => setCopiedId(null), 1500);
        }
      }

      function openAddModal(accountId) {
        setAddModal({ accountId, text: "", error: "" });
      }

      function doAddFlower() {
        if (!addModal || !addModal.text.trim()) return;
        const parts = addModal.text.trim().split(/\s+/);
        const newFlowers = [];
        for (const p of parts) {
          const m = p.match(/^(.+?)(\d+)$/);
          if (m) {
            const exists = accounts.find(a => a.accountId === addModal.accountId)?.flowers.some(f => f.name === m[1]);
            if (!exists) {
              newFlowers.push({ id: uid(), name: m[1], count: parseInt(m[2]), revivalTime: null, durationMs: DEFAULT_MS });
            }
          }
        }
        if (!newFlowers.length) {
          setAddModal(prev => ({ ...prev, error: "格式错误或花朵已存在，请使用 花名+数量 格式" }));
          return;
        }
        markEdited(addModal.accountId);
        setAccounts(prev => prev.map(a =>
          a.accountId !== addModal.accountId ? a
            : { ...a, flowers: [...a.flowers, ...newFlowers] }
        ));
        setAddModal(null);
      }

      // ========== 【修改】排序逻辑：置顶账号永远在最前面 ==========
      const sorted = [...accounts].sort((a, b) => {
        // 【新增】置顶账号排在最前面
        if (a.accountId === pinnedAccountId && b.accountId !== pinnedAccountId) return -1;
        if (b.accountId === pinnedAccountId && a.accountId !== pinnedAccountId) return 1;

        // 新添加的账号（所有花都是未记录状态）排在最前面
        const aAllUnknown = a.flowers.every(f => f.revivalTime === null);
        const bAllUnknown = b.flowers.every(f => f.revivalTime === null);
        if (aAllUnknown && !bAllUnknown) return -1;
        if (!aAllUnknown && bAllUnknown) return 1;

        // 其余按最紧急的花排序（剩余时间越短越靠前）
        // 「不着急」的花种不参与账号的紧急度计算：整个账号只剩不着急的枯萎花时，
        // 它的排序键变成未来最近的开花倒计时，自然沉到还有急事的账号后面
        // 例外：「只看不着急」视图下反过来 —— 池子就是这些花本身，按其中最急的一朵排，
        // 否则两边都算不出有限值（NaN），顺序会变成随机
        const poolOf = acc => lowPriorityOnly
          ? acc.flowers.filter(f => lowPriorityKinds.has(flowerKind(f.name)))
          : acc.flowers;
        const minRem = acc => {
          const rs = poolOf(acc)
            .filter(f => lowPriorityOnly || !lowPriorityKinds.has(flowerKind(f.name)))
            .map(f => remMs(f))
            .filter(r => r !== null);
          return rs.length ? Math.min(...rs) : Infinity;
        };
        const ra = minRem(a), rb = minRem(b);
        if (ra === rb) return 0;                      // 都是 Infinity 时保持原顺序（稳定排序）
        return ra - rb;
      });

      // ========== 搜索过滤 ==========
      // 「只看不着急」：先把账号裁成只含打了标的花（账号里一朵都不剩就整张卡片收掉）
      const viewSorted = lowPriorityOnly
        ? sorted
          .map(a => ({ ...a, flowers: a.flowers.filter(f => lowPriorityKinds.has(flowerKind(f.name))) }))
          .filter(a => a.flowers.length > 0)
        : sorted;

      const filteredSorted = viewSorted.filter(account => {
        // 搜索"//"显示所有折叠账号
        if (searchText.trim() === "//") {
          return collapsedAccounts.has(account.accountId);
        }
        // 无搜索时：折叠的账号不显示
        if (!searchText.trim()) {
          return !collapsedAccounts.has(account.accountId);
        }
        // 有搜索关键词时：所有账号（包括折叠的）都参与匹配
        const query = searchText.trim().toLowerCase();
        // 匹配账号ID
        if (account.accountId.toLowerCase().includes(query)) return true;
        // 匹配花名（部分匹配）
        return account.flowers.some(f => f.name.toLowerCase().includes(query));
      });


      const collapsedStats = accounts.reduce((stats, a) => {
        if (!collapsedAccounts.has(a.accountId)) return stats;

        const wilted = a.flowers.filter(f => {
          if (f.revivalTime === null) return false;
          const rem = remMs(f);
          return rem !== null && rem <= 0;
        }).reduce((sum, f) => sum + f.count, 0);

        const unknown = a.flowers.filter(f => f.revivalTime === null).reduce((sum, f) => sum + f.count, 0);

        return {
          wilted: stats.wilted + wilted,
          unknown: stats.unknown + unknown,
        };
      }, { wilted: 0, unknown: 0 });

      const totalFlowers = accounts.reduce((s, a) =>
        s + a.flowers.reduce((sum, f) => sum + (f.count || 0), 0), 0);
      const wiltedCount = accounts.reduce((s, a) =>
        s + a.flowers.filter(f => {
          if (f.revivalTime === null) return false;
          const rem = remMs(f);
          return rem !== null && rem <= 0;
        }).reduce((sum, f) => sum + (f.count || 0), 0), 0);


      return (
        // ========== 【修改】根容器点击时取消置顶 ==========
        <div
          style={{ minHeight: "100vh", background: C.bg, color: C.text, padding: "16px 14px", boxSizing: "border-box" }}
          onClick={(e) => {
            // 只有点「空白背景」才取消置顶；点按钮 / 输入框不该顺带把置顶清掉
            if (!pinnedAccountId) return;
            if (e.target.closest && e.target.closest("button, input, textarea, select, label, a")) return;
            setPinnedAccountId(null);
          }}
        >
          <div style={{ maxWidth: 720, margin: "0 auto" }}>

            {/* ========== 固定顶部包裹层 ========== */}
            <div style={{
              position: "sticky",
              top: -16,
              zIndex: 100,
              marginTop: -16,
              paddingTop: 16,
            }}>

              {/* ========== 顶部标题栏 ========== */}
              <div style={{
                display: "flex",
                justifyContent: "space-between",
                alignItems: "flex-start",
                marginBottom: 10,
                background: C.bg,
                paddingBottom: 4,
                borderBottom: `1px solid ${C.border}`,
              }}>

                        if (!modal) return;
                        const inputValue = e.target.value;

                        // 解析输入：支持 "3.5" 或 "3 30"
                        let totalHours = null;

                        if (inputValue.includes(' ')) {
                          // 格式： "3 30" → 3小时30分钟
                          const parts = inputValue.trim().split(/\s+/);
                          if (parts.length === 2) {
                            const hours = parseFloat(parts[0]);
                            const minutes = parseFloat(parts[1]);
                            if (!isNaN(hours) && !isNaN(minutes) && hours >= 0 && minutes >= 0) {
                              totalHours = hours + (minutes / 60);
                            }
                          }
                        } else {
                          // 格式： "3.5" → 3.5小时
                          const h = parseFloat(inputValue);
                          if (!isNaN(h) && h >= 0) {
                            totalHours = h;
                          }
                        }

                        // 更新显示值（保留用户输入的原始格式）
                        setModal({ ...modal, hours: inputValue });

                        // 如果解析成功，联动更新复活时间
                        if (totalHours !== null) {
                          const revivalTime = calcRevivalTimeFromRemaining(totalHours, modal.totalDurationMs);
                          setModal({ ...modal, hours: inputValue, revivalTimeStr: toDatetimeLocal(revivalTime) });
                        }

                        background: C.inputBg,

                      </div>

                          const allAllocations = dualColorModal.flowers.map((f, i) => ({
                            targets: f.rareTargets,
                            allocations: fillDualRemainder(f.name, f.count, f.rareTargets, dualColorModal.allocations[i] || []).alloc,
                          }));
                          dualColorModal.onConfirm(allAllocations);
                        }

                      style={{ ...btn(C.alive), flex: 1 }}
                    >

                    entries = entries.filter(([name]) => name.toLowerCase().includes(q));

                  // 预计算：每个花的进度、预计天数、统计（避免排序和渲染时重复计算）
                  const computed = new Map();
                  entries.forEach(([name, goal]) => {
                    const progress = goal.needed > 0 ? goal.owned / goal.needed : 0;
                    const estimatedDays = goal.needed > 0 ? getEstimatedDays(name, goal.needed, goal.owned) : null;
                    const stats = getAccountFlowerStats(name);
                    computed.set(name, { progress, estimatedDays, stats });
                  });

                  // 排序
                  entries.sort(([nameA, a], [nameB, b]) => {
                    const ca = computed.get(nameA);
                    const cb = computed.get(nameB);

                    switch (collectionSort) {
                      case "progress":
                        return ca.progress - cb.progress;
                      case "progressDesc":
                        return cb.progress - ca.progress;
                      case "name":
                        return nameA.localeCompare(nameB, "zh-CN");
                      case "nameDesc":
                        return nameB.localeCompare(nameA, "zh-CN");
                      case "earliest":
                        if (ca.estimatedDays === null && cb.estimatedDays === null) return 0;
                        if (ca.estimatedDays === null) return 1;
                        if (cb.estimatedDays === null) return -1;
                        return ca.estimatedDays - cb.estimatedDays;
                      case "latest":
                        if (ca.estimatedDays === null && cb.estimatedDays === null) return 0;
                        if (ca.estimatedDays === null) return 1;
                        if (cb.estimatedDays === null) return -1;
                        return cb.estimatedDays - ca.estimatedDays;
                      default:
                        return 0;
                    }
                  });

                          : "没有匹配的目标花"}
                      </div>
                    );

                    const c = computed.get(flowerName);
                    const progress = Math.min(c.progress, 1);
                    const remaining = goal.needed - goal.owned;
                    const estimatedDays = c.estimatedDays;
                    const isCompleted = goal.needed > 0 && goal.owned >= goal.needed;
                    const hasStats = c.stats.single > 0 || c.stats.dual > 0;
                    const isLowPriority = lowPriorityKinds.has(flowerName);

                    return (

                        padding: 10,
                        background: isDark ? "rgba(255,255,255,0.05)" : "rgba(0,0,0,0.03)",

                                fontSize: 11,
                                color: C.muted,
                                background: isDark ? "rgba(255,255,255,0.08)" : "rgba(0,0,0,0.06)",
                                padding: "1px 8px",
                                borderRadius: 10,
                              }}>
                                {c.stats.single}+{c.stats.dual}
                              </span>
                            )}
                          </div>
                          <div style={{ display: "flex", gap: 4, alignItems: "center" }}>
                            <button
                              onClick={() => {
                                setLowPriorityKinds(prev => {
                                  const next = new Set(prev);
                                  if (next.has(flowerName)) next.delete(flowerName);
                                  else next.add(flowerName);
                                  return next;
                                });
                              }}
                              style={{
                                background: isLowPriority ? C.accentDim : "transparent",
                                border: `1px solid ${isLowPriority ? C.accentDim : C.border}`,
                                borderRadius: 10,
                                padding: "1px 8px",
                                fontSize: 11,
                                color: isLowPriority ? "#ffffff" : C.muted,
                                cursor: "pointer",
                                fontFamily: "inherit",
                                lineHeight: 1.6,
                              }}
                              title={"标记为「不着急」：这种花在所有账号里都会沉到所属账号的最下面，方便你先看别的。\n只影响排序，不影响任何数字（待处理、今日额度、日历统计都不变）。"}
                            >不着急{isLowPriority ? " ✓" : ""}</button>
                            <button
                              onClick={() => {
                                setCollectionAddModal({
                                  flowerName: flowerName,
                                  originalName: flowerName,
                                  needed: goal.needed,
                                  owned: goal.owned,
                                  isEdit: true,
                                });
                              }}
                              style={{ background: "transparent", border: "none", color: C.muted, fontSize: 12, cursor: "pointer" }}

              }}
              onMouseLeave={e => {
                e.currentTarget.style.transform = 'translateY(0) scale(1)';
                e.currentTarget.style.boxShadow = isDark
                  ? '0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1), 0 0 0 1px rgba(180,143,208,0.1)'
                  : '0 8px 32px rgba(123,79,160,0.15), inset 0 1px 0 rgba(255,255,255,0.6), 0 0 0 1px rgba(180,143,208,0.08)';
              }}
              onMouseDown={e => {
                e.currentTarget.style.transform = 'translateY(0) scale(0.95)';
              }}
              onMouseUp={e => {
                e.currentTarget.style.transform = 'translateY(-2px) scale(1.05)';
              }}
              title="回到顶部"
            >
              ⇧
            </button>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
