                  style={{ ...btn(C.accentDim), width: "100%", marginBottom: 12, fontSize: 12 }}
                >
                  一键添加所有珍稀花（默认目标100朵）
                </button>

                {/* 需要总数 */}
                <div style={{ marginBottom: 12 }}>
                  <label style={{ fontSize: 13, color: C.muted, display: "block", marginBottom: 4 }}>需要总数</label>
                  <input
                    type="number"
                    min={0}
                    value={collectionAddModal.needed || ""}
                    onChange={e => setCollectionAddModal({ ...collectionAddModal, needed: parseInt(e.target.value) || 0 })}
                    placeholder="0"
                    style={{
                      width: "100%",
                      background: C.inputBg,
                      border: `1px solid ${C.border}`,
                      borderRadius: 8,
                      padding: "10px 12px",
                      color: C.text,
                      fontSize: 14,
                      fontFamily: "inherit",
                      outline: "none",
                    }}
                  />
                </div>

                {/* 已有数量 */}
                <div style={{ marginBottom: 16 }}>
                  <label style={{ fontSize: 13, color: C.muted, display: "block", marginBottom: 4 }}>已有数量</label>
                  <input
                    type="number"
                    min={0}
                    value={collectionAddModal.owned || ""}
                    onChange={e => setCollectionAddModal({ ...collectionAddModal, owned: parseInt(e.target.value) || 0 })}
                    placeholder="0"
                    style={{
                      width: "100%",
                      background: C.inputBg,
                      border: `1px solid ${C.border}`,
                      borderRadius: 8,
                      padding: "10px 12px",
                      color: C.text,
                      fontSize: 14,
                      fontFamily: "inherit",
                      outline: "none",
                    }}
                  />
                </div>

                <div style={{ display: "flex", gap: 8 }}>
                  <button
                    onClick={() => {
                      const name = collectionAddModal.flowerName?.trim();
                      const needed = collectionAddModal.needed || 0;
                      const owned = collectionAddModal.owned || 0;
                      if (!name) {
                        alert("请输入花名");
                        return;
                      }
                      // 编辑模式下如果花名变了，删除旧的花名
                      if (collectionAddModal.isEdit && collectionAddModal.originalName && collectionAddModal.originalName !== name) {
                        removeCollectionGoal(collectionAddModal.originalName);
                      }
                      setCollectionGoal(name, needed, owned);
                      setCollectionAddModal(null);
                    }}
                    style={{ ...btn(C.alive), flex: 1 }}
                  >
                    {collectionAddModal.isEdit ? "确认修改" : "确认添加"}
                  </button>
                  <button
                    onClick={() => setCollectionAddModal(null)}
                    style={{ ...btn(C.muted), flex: 1 }}
                  >
                    取消
                  </button>
                </div>
              </div>
            </div>
          )}

          {showBackup && (
            <div
              onClick={() => setShowBackup(false)}
              style={{
                position: "fixed", inset: 0, background: "rgba(0,0,0,0.75)",
                display: "flex", alignItems: "center", justifyContent: "center",
                zIndex: 300, padding: 16,
              }}
            >
              <div
                onClick={e => e.stopPropagation()}
                className={isDark ? "dark-scrollbar" : "light-scrollbar"}
                style={{
                  background: C.modalBg,
                  border: `1px solid ${C.accentDim}`,
                  borderRadius: 12,
                  padding: 18,
                  width: "100%",
                  maxWidth: 520,
                  maxHeight: "86vh",
                  overflowY: "auto",
                  color: C.text,
                }}
              >
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
                  <span style={{ fontSize: 16, fontWeight: 700, color: C.accent }}>💾 备份与同步</span>
                  <button onClick={() => setShowBackup(false)} style={{ background: "transparent", border: "none", color: C.muted, fontSize: 16, cursor: "pointer" }}>✕</button>
                </div>
                <div style={{ fontSize: 12, color: C.muted, lineHeight: 1.6, marginBottom: 14 }}>
                  包含：账号与花朵、收集目标、枯萎提醒开关、折叠账号、收集排序、主题与置顶账号。
                </div>

                {backupMsg && (
                  <div style={{
                    fontSize: 12, lineHeight: 1.6, borderRadius: 8, padding: "8px 12px", marginBottom: 14,
                    background: (backupMsg.type === "ok" ? C.alive : C.wilted) + "25",
                    border: `1px solid ${backupMsg.type === "ok" ? C.alive : C.wilted}50`,
                    color: backupMsg.type === "ok" ? C.alive : C.wilted,
                  }}>{backupMsg.text}</div>
                )}

                <div style={{ fontSize: 13, fontWeight: 600, color: C.accent, marginBottom: 8 }}>文件备份</div>
                <div style={{ display: "flex", gap: 8, marginBottom: 18 }}>
                  <button onClick={exportData} style={{ ...btn(C.accent), flex: 1, fontSize: 13 }}>💾 导出为 JSON</button>
                  <label style={{ ...btn(C.muted), flex: 1, fontSize: 13, textAlign: "center", cursor: "pointer" }}>
                    📂 从文件导入
                    <input type="file" accept=".json" onChange={e => { if (e.target.files[0]) importData(e.target.files[0]); e.target.value = ""; }} style={{ display: "none" }} />
                  </label>
                </div>

                <div style={{ fontSize: 13, fontWeight: 600, color: C.accent, marginBottom: 8 }}>分享码 · 跨设备粘贴同步</div>
                <div style={{ display: "flex", gap: 6, marginBottom: 8 }}>
                  {SHARE_SCOPES.map(s => (
                    <button
                      key={s.id}
                      onClick={() => { setShareScope(s.id); setBackupMsg(null); }}
                      title={s.hint}
                      style={{
                        flex: 1, fontSize: 12, padding: "5px 0", borderRadius: 6, cursor: "pointer", fontFamily: "inherit",
                        background: shareScope === s.id ? C.accentDim : "transparent",
                        color: shareScope === s.id ? "#ffffff" : C.muted,
                        border: `1px solid ${shareScope === s.id ? C.accentDim : C.border}`,
                      }}
                    >{s.label}</button>
                  ))}
                </div>
                <button onClick={generateShareCode} style={{ ...btn(C.accentDim), width: "100%", fontSize: 13, marginBottom: 8 }}>🔗 生成分享码</button>
                {shareCode && (
                  <>
                    <textarea
                      readOnly
                      value={shareCode}
                      onFocus={e => e.target.select()}
                      rows={3}
                      style={codeBox(C, isDark)}
                    />
                    <button
                      onClick={() => copyText(shareCode, "__share__")}
                      style={{ ...btn(C.alive), width: "100%", fontSize: 13, margin: "8px 0 12px" }}
                    >{copiedId === "__share__" ? "✓ 已复制" : "📋 复制分享码"}</button>
                  </>
                )}
                <textarea
                  value={sharePaste}
                  onChange={e => { setSharePaste(e.target.value); setBackupMsg(null); }}
                  rows={3}
                  placeholder="把另一台设备生成的分享码粘贴到这里…"
                  style={{ ...codeBox(C, isDark), marginBottom: 8 }}
                />
                <button onClick={importShareCode} style={{ ...btn(C.alive), width: "100%", fontSize: 13, marginBottom: 18 }}>📥 导入分享码</button>

                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                  <span style={{ fontSize: 13, fontWeight: 600, color: C.accent }}>自动快照 · 最近 {SNAPSHOT_MAX} 次改动前</span>
                  {snapshots.length > 0 && (
                    <button onClick={clearSnapshots} style={tinyBtn(C.muted)}>清空</button>
                  )}
                </div>
                {snapshots.length === 0 ? (
                  <div style={{ fontSize: 12, color: C.muted, padding: "6px 0 2px" }}>暂无快照，改动数据后会自动生成。</div>
                ) : (
                  <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                    {snapshots.map(snap => {
                      const sum = snapshotSummary(snap.data);
                      return (
                        <div key={snap.at} style={{
                          display: "flex", alignItems: "center", justifyContent: "space-between",
                          background: isDark ? "rgba(255,255,255,0.05)" : "rgba(0,0,0,0.03)",
                          borderRadius: 8, padding: "8px 12px",
                        }}>
                          <div style={{ fontSize: 12, color: C.text }}>
                            {fmtBackupTime(new Date(snap.at).toISOString())}
                            <span style={{ color: C.muted, marginLeft: 8 }}>{sum.accounts} 账号 · {sum.flowers} 种花</span>
                          </div>
                          <button onClick={() => restoreSnapshot(snap)} style={tinyBtn(C.urgent)}>恢复</button>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            </div>
          )}

          {pendingRestore && (
            <div
              onClick={() => setPendingRestore(null)}
              style={{
                position: "fixed", inset: 0, background: "rgba(0,0,0,0.8)",
                display: "flex", alignItems: "center", justifyContent: "center",
                zIndex: 400, padding: 16,
              }}
            >
              <div
                onClick={e => e.stopPropagation()}
                style={{
                  background: C.modalBg, border: `1px solid ${C.accentDim}`,
                  borderRadius: 12, padding: 20, width: "100%", maxWidth: 380, color: C.text,
                }}
              >
                <div style={{ fontSize: 16, fontWeight: 700, color: C.accent, marginBottom: 8 }}>选择导入方式</div>
                <div style={{ fontSize: 12, color: C.muted, lineHeight: 1.7, marginBottom: 14 }}>
                  来自{pendingRestore.source}的备份：
                  <div style={{ color: C.text, marginTop: 4 }}>
                    {(() => {
                      const p = pendingRestore.backup;
                      const flowers = (p.accounts || []).reduce((s, a) => s + ((a.flowers || []).length), 0);
                      const goals = Object.keys(p.collectionGoals || {}).length;
                      if (!(p.accounts || []).length) return "仅设置（主题 / 排序 / 提醒 / 折叠 / 置顶），不含账号数据";
                      return `${p.accounts.length} 个账号 · ${flowers} 种花 · ${goals} 个收集目标${p._version === 1 ? "（旧版备份，仅含账号数据）" : ""}`;
                    })()}
                  </div>
                </div>

                {(pendingRestore.backup.accounts || []).length > 0 && (
                  <>
                    <button onClick={() => applyBackup(pendingRestore.backup, "merge")} style={{ ...btn(C.alive), width: "100%", fontSize: 13, marginBottom: 8 }}>
                      🔀 合并导入 · 按账号ID合并，缺的保留
                    </button>
                    <button onClick={() => applyBackup(pendingRestore.backup, "overwrite")} style={{ ...btn(C.urgent), width: "100%", fontSize: 13, marginBottom: 8 }}>
                      ♻️ 覆盖导入 · 清空现有账号数据
                    </button>
                  </>
                )}
                <button onClick={() => applyBackup(pendingRestore.backup, "prefsOnly")} style={{ ...btn(C.accentDim), width: "100%", fontSize: 13, marginBottom: 12 }}>
                  ⚙️ 只导入设置 · 账号数据不动
                </button>
                <button onClick={() => setPendingRestore(null)} style={{ ...btn(C.muted), width: "100%", fontSize: 13 }}>取消</button>
              </div>
            </div>
          )}

          {showBackToTop && (
            <button
              onClick={(e) => {
                e.stopPropagation();  // ← 新增这行
                window.scrollTo({ top: 0, behavior: 'smooth' });
              }}
              style={{
                position: 'fixed',
                bottom: 24,
                right: 24,
                width: 48,
                height: 48,
                borderRadius: '50%',
                background: isDark
                  ? 'linear-gradient(135deg, rgba(180, 143, 208, 0.15) 0%, rgba(106, 64, 128, 0.25) 100%)'
                  : 'linear-gradient(135deg, rgba(180, 143, 208, 0.1) 0%, rgba(106, 64, 128, 0.2) 100%)',
                backdropFilter: 'blur(12px) saturate(180%)',
                WebkitBackdropFilter: 'blur(12px) saturate(180%)',
                border: `1px solid ${isDark ? 'rgba(255,255,255,0.15)' : 'rgba(255,255,255,0.4)'}`,
                color: C.accent,
                fontSize: 22,
                cursor: 'pointer',
                display: 'flex',
                alignItems: 'center',
                justifyContent: 'center',
                boxShadow: isDark
                  ? '0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1), 0 0 0 1px rgba(180,143,208,0.1)'
                  : '0 8px 32px rgba(123,79,160,0.15), inset 0 1px 0 rgba(255,255,255,0.6), 0 0 0 1px rgba(180,143,208,0.08)',
                zIndex: 100,
                transition: 'all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1)',
                opacity: showBackToTop ? 1 : 0,
                transform: showBackToTop ? 'translateY(0) scale(1)' : 'translateY(10px) scale(0.9)',
              }}
              onMouseEnter={e => {
                e.currentTarget.style.transform = 'translateY(-2px) scale(1.05)';
                e.currentTarget.style.boxShadow = isDark
                  ? '0 12px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.15), 0 0 20px rgba(180,143,208,0.2)'
                  : '0 12px 40px rgba(123,79,160,0.25), inset 0 1px 0 rgba(255,255,255,0.8), 0 0 20px rgba(180,143,208,0.15)';
              }}
              onMouseLeave={e => {
                e.currentTarget.style.transform = 'translateY(0) scale(1)';
                e.currentTarget.style.boxShadow = isDark
                  ? '0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1), 0 0 0 1px rgba(180,143,208,0.1)'
                  : '0 8px 32px rgba(123,79,160,0.15), inset 0 1px 0 rgba(255,255,255,0.6), 0 0 0 1px rgba(180,143,208,0.08)';
              }}
              onMouseDown={e => {
                e.currentTarget.style.transform = 'translateY(0) scale(0.95)';
              }}
              onMouseUp={e => {
                e.currentTarget.style.transform = 'translateY(-2px) scale(1.05)';
              }}
              title="回到顶部"
            >
              ⇧
            </button>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
